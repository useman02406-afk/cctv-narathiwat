﻿<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แจ้งซ่อมกล้อง CCTV</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-guard.js"></script><script src="smart-alert.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fefce8;color:#422006;font-family:'Noto Sans Thai',sans-serif}.top{padding:14px clamp(18px,4vw,52px);background:linear-gradient(120deg,#a16207,#eab308);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:19px;margin:0}.top p{margin:2px 0;color:#fef9c3;font-size:13px}.wrap{max-width:1360px;margin:26px auto;padding:0 18px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.btn,.back{border:0;border-radius:9px;padding:10px 13px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}.back{background:#fff;color:#a16207}.btn{background:#ca8a04;color:#fff}.btn.secondary{background:#e2e8f0;color:#1e293b}.btn.danger{background:#dc2626}.btn.small{font-size:12px;padding:6px 8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat,.panel{background:#fff;border:1px solid #fde68a;border-radius:13px;box-shadow:0 4px 16px #0f172a0c}.stat{padding:17px}.stat label{font-size:13px;color:#64748b}.stat b{display:block;font-size:26px;margin-top:4px}.panel{padding:20px;margin-bottom:18px}.panel h2{font-size:18px;margin:0 0 16px}.hidden{display:none!important}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.field{display:flex;gap:5px;flex-direction:column;font-size:13px;font-weight:600}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:#fff}.field textarea{min-height:65px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.notice{font-size:13px;padding:10px 12px;background:#fef9c3;color:#854d0e;border-radius:8px;margin-bottom:13px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.filters input,.filters select{font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:8px}.filters input{flex:1;min-width:200px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;background:#fefce8;color:#64748b;font-weight:600}th,td{border-bottom:1px solid #fef3c7;padding:11px;vertical-align:top}.tag{display:inline-block;background:#fef3c7;color:#a16207;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700}.tag.done{background:#dcfce7;color:#15803d}.empty{text-align:center;color:#64748b;padding:28px}@media(max-width:800px){.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}@media(max-width:460px){.stats{grid-template-columns:1fr}}</style></head><body><header class="top"><div><h1><i class="fa-solid fa-screwdriver-wrench"></i> แจ้งซ่อมและบำรุงรักษากล้อง</h1><p>ติดตามปัญหากล้อง CCTV ตั้งแต่รับแจ้งจนแก้ไขแล้ว</p></div><div id="user">กำลังตรวจสอบสิทธิ์…</div></header><main class="wrap"><div class="bar"><a class="back" href="camera-management.html"><i class="fa-solid fa-arrow-left"></i> กลับจัดการข้อมูลกล้อง</a><button class="btn" id="new"><i class="fa-solid fa-plus"></i> แจ้งปัญหากล้อง</button></div><section class="stats"><div class="stat"><label>รายการทั้งหมด</label><b id="all">–</b></div><div class="stat"><label>กำลังดำเนินการ</label><b id="progress">–</b></div><div class="stat"><label>เร่งด่วน</label><b id="urgent">–</b></div><div class="stat"><label>แก้ไขแล้ว</label><b id="done">–</b></div></section><section class="panel hidden" id="formPanel"><h2 id="formTitle">แจ้งปัญหากล้อง</h2><div class="form"><label class="field full">จุดกล้อง *<select id="camera"></select></label><label class="field">ประเภทปัญหา<select id="issue"><option>กล้องไม่ออนไลน์</option><option>ภาพไม่ชัด</option><option>อุปกรณ์ชำรุด</option><option>ตรวจสอบสภาพ</option><option>ย้ายจุดติดตั้ง</option><option>อื่น ๆ</option></select></label><label class="field">ความสำคัญ<select id="priority"><option>ต่ำ</option><option selected>ปกติ</option><option>สูง</option><option>เร่งด่วน</option></select></label><label class="field">สถานะ<select id="status"><option>รับแจ้ง</option><option>มอบหมายแล้ว</option><option>กำลังดำเนินการ</option><option>แก้ไขแล้ว</option><option>ยกเลิก</option></select></label><label class="field">กำหนดเสร็จ<input type="datetime-local" id="dueAt"></label><label class="field">ผู้รับผิดชอบ<input id="assigned" placeholder="ชื่อหรือหน่วยงาน"></label><label class="field">แก้ไขแล้วเมื่อ<input type="datetime-local" id="resolvedAt"></label><label class="field full">รายละเอียดปัญหา *<textarea id="detail" placeholder="อาการที่พบ หรือข้อมูลประกอบ"></textarea></label><label class="field full">ผลการแก้ไข<textarea id="resolution" placeholder="บันทึกผลหลังดำเนินการ"></textarea></label></div><div class="actions"><button class="btn secondary" id="cancel">ยกเลิก</button><button class="btn" id="save"><i class="fa-solid fa-floppy-disk"></i> บันทึก</button></div></section><section class="panel"><h2>รายการแจ้งซ่อม</h2><div id="notice" class="notice">กำลังโหลดข้อมูล…</div><div class="filters"><input id="search" placeholder="ค้นหาชื่อกล้อง รหัสกล้อง พื้นที่ หรือปัญหา"><select id="filter"><option value="">ทุกสถานะ</option><option>รับแจ้ง</option><option>มอบหมายแล้ว</option><option>กำลังดำเนินการ</option><option>แก้ไขแล้ว</option><option>ยกเลิก</option></select></div><div class="tablewrap"><table><thead><tr><th>กล้อง</th><th>ปัญหา</th><th>ผู้รับผิดชอบ</th><th>กำหนดเสร็จ</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>(()=>{let db,session,items=[],cameras=[],editId=null;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const dt=v=>v?new Date(v).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}):'–';const local=v=>v?new Date(new Date(v).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):'';const canEdit=x=>session.profile.role==='ADMIN'||x.created_by===session.user.id;function camLabel(c){return [c.uid,c.camera_name||c.name,c.area].filter(Boolean).join(' · ')||`กล้อง #${c.id}`}function options(){const old=$('camera').value;$('camera').innerHTML='<option value="">เลือกจุดกล้อง</option>'+cameras.map(c=>`<option value="${c.id}">${esc(camLabel(c))}</option>`).join('');$('camera').value=old}function render(){const q=$('search').value.toLowerCase(),f=$('filter').value,list=items.filter(x=>(!q||[camLabel(x.cctv_locations||{}),x.issue_type,x.detail,x.assigned_to].some(v=>String(v||'').toLowerCase().includes(q)))&&(!f||x.status===f));$('all').textContent=items.length;$('progress').textContent=items.filter(x=>['มอบหมายแล้ว','กำลังดำเนินการ'].includes(x.status)).length;$('urgent').textContent=items.filter(x=>x.priority==='เร่งด่วน'&&x.status!=='แก้ไขแล้ว').length;$('done').textContent=items.filter(x=>x.status==='แก้ไขแล้ว').length;$('rows').innerHTML=list.length?list.map(x=>`<tr><td><b>${esc(camLabel(x.cctv_locations||{}))}</b></td><td><span class="tag">${esc(x.issue_type)}</span> · ${esc(x.priority)}<br><small>${esc(x.detail)}</small></td><td>${esc(x.assigned_to||'–')}</td><td>${dt(x.due_at)}</td><td><span class="tag ${x.status==='แก้ไขแล้ว'?'done':''}">${esc(x.status)}</span></td><td>${canEdit(x)?`<button class="btn small secondary" data-edit="${x.id}"><i class="fa-solid fa-pen"></i></button>${session.profile.role==='ADMIN'?` <button class="btn small danger" data-del="${x.id}"><i class="fa-solid fa-trash"></i></button>`:''}`:'–'}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">ยังไม่มีรายการแจ้งซ่อม</td></tr>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>remove(b.dataset.del))}function clear(){editId=null;$('formTitle').textContent='แจ้งปัญหากล้อง';$('camera').value='';$('issue').value='กล้องไม่ออนไลน์';$('priority').value='ปกติ';$('status').value='รับแจ้ง';['dueAt','assigned','resolvedAt','detail','resolution'].forEach(id=>$(id).value='')}function openEdit(id){const x=items.find(v=>v.id===id);if(!x)return;editId=id;$('formTitle').textContent='แก้ไขรายการแจ้งซ่อม';$('camera').value=x.camera_id;$('issue').value=x.issue_type;$('priority').value=x.priority;$('status').value=x.status;$('dueAt').value=local(x.due_at);$('assigned').value=x.assigned_to||'';$('resolvedAt').value=local(x.resolved_at);$('detail').value=x.detail;$('resolution').value=x.resolution||'';$('formPanel').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}async function load(){const [a,b]=await Promise.all([db.from('cctv_locations').select('id,uid,camera_name,name,area').order('id').limit(2000),db.from('camera_maintenance_tickets').select('*,cctv_locations(uid,camera_name,name,area)').order('reported_at',{ascending:false}).limit(500)]);if(a.error||b.error){$('notice').textContent='โหลดข้อมูลไม่สำเร็จ: '+(a.error||b.error).message;return}cameras=a.data||[];items=b.data||[];options();render();$('notice').textContent=`แสดง ${items.length} รายการ · จุดกล้องที่เลือกได้ ${cameras.length} จุด`}async function save(){const p={camera_id:Number($('camera').value),issue_type:$('issue').value,priority:$('priority').value,status:$('status').value,due_at:$('dueAt').value?new Date($('dueAt').value).toISOString():null,assigned_to:$('assigned').value.trim()||null,resolved_at:$('resolvedAt').value?new Date($('resolvedAt').value).toISOString():null,detail:$('detail').value.trim(),resolution:$('resolution').value.trim()||null,updated_at:new Date().toISOString()};if(!p.camera_id||!p.detail)return alert('กรุณาเลือกจุดกล้องและระบุรายละเอียดปัญหา');$('save').disabled=true;const r=editId?await db.from('camera_maintenance_tickets').update(p).eq('id',editId):await db.from('camera_maintenance_tickets').insert(p);$('save').disabled=false;if(r.error)return alert('บันทึกไม่สำเร็จ: '+r.error.message);$('formPanel').classList.add('hidden');clear();load()}async function remove(id){if(!confirm('ลบรายการแจ้งซ่อมนี้หรือไม่'))return;const r=await db.from('camera_maintenance_tickets').delete().eq('id',id);if(r.error)return alert('ลบไม่สำเร็จ: '+r.error.message);load()}function start(e){session=e.detail||window.cctvSession;if(!session)return;if(!['ADMIN','OFFICER'].includes(session.profile.role)){alert('บัญชีนี้ไม่มีสิทธิ์เข้าถึงงานบำรุงรักษากล้อง');location.replace('home.html');return}db=session.client;$('user').textContent=`${session.profile.full_name||session.user.email} · ${session.profile.role}`;$('new').onclick=()=>{clear();$('formPanel').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})};$('cancel').onclick=()=>{$('formPanel').classList.add('hidden');clear()};$('save').onclick=save;['search','filter'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));clear();load()}if(window.cctvSession)start({detail:window.cctvSession});else window.addEventListener('cctv-auth-ready',start,{once:true})})();</script></body></html>

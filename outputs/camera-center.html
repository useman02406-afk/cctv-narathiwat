<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ศูนย์จัดการกล้อง CCTV</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-guard.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eef6ff;color:#15283d;font-family:'Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;-webkit-font-smoothing:antialiased}.top{padding:18px clamp(18px,4vw,52px);color:#fff;background:linear-gradient(120deg,#0f4c81,#0284c7);display:flex;align-items:center;justify-content:space-between;gap:16px}.top h1{font-size:22px;margin:0}.top p{margin:3px 0 0;color:#dbeafe;font-size:13px}.header-actions{display:flex;gap:8px;align-items:center}.back,.refresh{border:1px solid #ffffff80;color:#fff;background:#ffffff12;border-radius:9px;padding:9px 12px;font:inherit;font-weight:700;text-decoration:none;white-space:nowrap;cursor:pointer}.refresh:hover{background:#ffffff26}.wrap{max-width:1500px;margin:22px auto;padding:0 18px}.overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{padding:12px;border-radius:11px;background:#fff;border:1px solid #c8e0f0;box-shadow:0 3px 12px #0f172a0c}.metric span{font-size:12px;color:#5d7482}.metric b{display:block;font-size:22px;color:#075e8b;margin-top:3px}.metric.warn b{color:#b45309}.metric.actionable{cursor:pointer;transition:transform .15s,box-shadow .15s}.metric.actionable:hover{transform:translateY(-2px);box-shadow:0 7px 18px #0f172a24}.type-card{border-left:5px solid var(--marker,#2563eb)}.tabs{display:flex;gap:9px;flex-wrap:wrap;flex:0 0 auto;margin-bottom:14px}.tab{border:1px solid #bcd8ee;background:#fff;border-radius:9px;padding:10px 13px;font:inherit;font-weight:700;color:#27536e;cursor:pointer}.tab.active{background:#087db8;color:#fff;border-color:#087db8;box-shadow:0 4px 12px #087db83b}.stage{overflow:hidden;background:#fff;border:1px solid #c8e0f0;border-radius:14px;box-shadow:0 5px 20px #0f172a14}.stage iframe{display:block;border:0;width:100%;height:calc(100vh - 342px);min-height:620px;background:#fff}body.camera-map-active{overflow:hidden}body.camera-map-active .wrap{height:calc(100vh - 102px);margin:10px auto;display:flex;flex-direction:column}body.camera-map-active .overview{display:none}body.camera-map-active .tabs{margin-bottom:10px}body.camera-map-active .stage{flex:1;min-height:0}body.camera-map-active .stage iframe{height:100%;min-height:0}@media(max-width:1000px){.overview{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column;padding:12px}.header-actions{width:100%;flex-wrap:wrap}.wrap{padding:0 10px}.overview{grid-template-columns:repeat(2,1fr)}.tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding:1px 2px 8px;margin-bottom:8px;-webkit-overflow-scrolling:touch}.tab{flex:0 0 auto;scroll-snap-align:start;font-size:12px;padding:9px 11px;white-space:nowrap}.stage iframe{height:calc(100vh - 560px);min-height:560px}body.camera-map-active .wrap{height:calc(100vh - 146px);margin:7px auto}body.camera-map-active .stage iframe{height:100%;min-height:0}}
  </style>
</head>
<body>
  <header class="top"><div><h1><i class="fa-solid fa-video"></i> ศูนย์จัดการกล้อง CCTV</h1><p>ข้อมูลจุดติดตั้ง การจัดการกล้อง หมวดหมู่ การซ่อมบำรุง และการตรวจสภาพ</p></div><div class="header-actions"><button class="refresh" id="refresh" type="button"><i class="fa-solid fa-rotate"></i> รีเฟรชข้อมูล</button><a class="back" href="home.html"><i class="fa-solid fa-arrow-left"></i> กลับหน้าหลัก</a></div></header>
  <main class="wrap">
    <nav class="tabs" aria-label="เมนูจัดการกล้อง">
      <button class="tab active" data-src="camera-locations-map.html"><i class="fa-solid fa-map-location-dot"></i> ข้อมูลและจุดติดตั้ง</button>
      <button class="tab" data-src="camera-management.html"><i class="fa-solid fa-sliders"></i> จัดการข้อมูลกล้อง</button>
      <button class="tab" data-src="camera-duplicate-review.html"><i class="fa-solid fa-copy"></i> ตรวจข้อมูลซ้ำ</button>
      <button class="tab" data-src="camera-categories.html"><i class="fa-solid fa-tags"></i> จัดการหมวดหมู่กล้อง</button>
      <button class="tab" data-src="camera-maintenance.html"><i class="fa-solid fa-screwdriver-wrench"></i> แจ้งซ่อมและบำรุงรักษา</button>
      <button class="tab" data-src="camera-inspections.html"><i class="fa-solid fa-clipboard-check"></i> บันทึกตรวจสภาพกล้อง</button>
    </nav>
    <section class="stage"><iframe id="workspace" title="พื้นที่ทำงานจัดการกล้อง" src="camera-locations-map.html"></iframe></section>
  </main>
  <style>
    /* Keep the map workspace tall even when this page is embedded by another module. */
    body.camera-map-active{overflow-y:auto!important}
    body.camera-map-active .stage{height:calc(100vh - 190px)!important;min-height:520px!important;flex:none!important}
    body.camera-map-active .stage iframe{height:100%!important;min-height:520px!important}
    @supports(height:100dvh){body.camera-map-active .stage{height:calc(100dvh - 190px)!important}}
    @media(max-width:650px){body.camera-map-active .stage{height:calc(100vh - 170px)!important;min-height:420px!important}body.camera-map-active .stage iframe{min-height:420px!important}}
  </style>
  <script>
    (()=>{
      const frame=document.getElementById('workspace'),cacheVersion='20260803-04';
      frame.addEventListener('load',()=>[80,300,800].forEach(delay=>setTimeout(()=>{try{frame.contentWindow.dispatchEvent(new Event('resize'))}catch(error){/* iframe is not ready yet */}},delay)));
      const openTab=(btn,forwardedSearch='')=>{const src=btn.dataset.src,params=new URLSearchParams(String(forwardedSearch).replace(/^\?/,''));if(src==='camera-locations-map.html')params.set('v',cacheVersion);const query=params.toString();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===btn));document.body.classList.toggle('camera-map-active',src==='camera-locations-map.html');frame.src=src+(query?`?${query}`:'');history.replaceState(null,'',`#${src}${forwardedSearch?`?${String(forwardedSearch).replace(/^\?/,'')}`:''}`)};
      document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>openTab(btn)));
      document.getElementById('refresh').addEventListener('click',()=>location.reload());
      const requested=location.hash.slice(1),[rawRequestedSrc,...requestedQuery]=requested.split('?'),requestedSrc=rawRequestedSrc==='camera-record-browser.html'?'camera-management.html':rawRequestedSrc==='camera-data-quality.html'?'camera-duplicate-review.html':rawRequestedSrc;const selected=[...document.querySelectorAll('.tab')].find(x=>x.dataset.src===requestedSrc)||document.querySelector('.tab.active');if(selected)openTab(selected,requestedQuery.join('?'));
    })();
  </script>
</body>
</html>

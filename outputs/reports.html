﻿<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ศูนย์รายงาน</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-guard.js?v=2"></script>
  <style>
    :root{--blue:#0e7490;--ink:#172033;--muted:#64748b;--line:#dbeafe}*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:var(--ink);font-family:'Noto Sans Thai',sans-serif;overflow-x:hidden}.top{padding:14px clamp(18px,4vw,52px);background:linear-gradient(120deg,#0f4c5c,#0e7490);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{font-size:19px;margin:0}.top p{font-size:13px;margin:2px 0;color:#cffafe}.wrap{max-width:1250px;margin:26px auto;padding:0 18px}.back,.btn{border:0;border-radius:9px;padding:10px 13px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}.back{display:inline-block;background:#fff;color:#0e7490;margin-bottom:18px}.notice{background:#ecfeff;color:#0e7490;border-radius:10px;padding:11px 13px;margin-bottom:18px;font-size:13px}.notice.error{background:#fff1f2;color:#b42335}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:0 4px 16px #0f172a0c}.card .icon{font-size:22px;color:#0891b2}.card h2{font-size:16px;margin:8px 0 2px}.count{font-size:28px;font-weight:700}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{background:#0e7490;color:#fff;font-size:13px}.btn.secondary{background:#334155}.btn.map{background:#1769e0}.btn:disabled{opacity:.6;cursor:wait}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tools .btn{margin:0}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;margin-top:18px;overflow:hidden}.panel h2{font-size:18px;margin:0 0 12px}.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left}th{color:#64748b;background:#f8fafc}.empty{color:var(--muted);padding:16px;text-align:center}@media(max-width:750px){.top{align-items:stretch;flex-direction:column;padding:14px 16px}.top h1{font-size:18px}.top p{font-size:12px;line-height:1.55}.top #user{font-size:13px;padding-top:4px}.wrap{margin:14px auto 28px;padding:0 12px}.back{width:100%;min-height:46px;text-align:center;margin-bottom:12px}.notice{line-height:1.55;margin-bottom:12px}.grid{grid-template-columns:1fr;gap:10px}.card{padding:15px}.card h2{font-size:16px}.count{font-size:26px}.actions,.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .btn,.tools .btn{width:100%;min-height:44px;text-align:center;padding:10px 8px}.panel{margin-top:14px;padding:14px 0 4px}.panel h2{font-size:17px;padding:0 14px}.table-wrap{width:100%}table{min-width:540px;font-size:12px}th,td{padding:9px 10px}.connection-status{bottom:12px!important;left:12px!important;right:12px!important;width:auto!important}}@media(max-width:390px){.actions,.tools{grid-template-columns:1fr}.card{padding:14px}}@media print{.back,.tools,.actions{display:none!important}.top{background:#fff;color:#172033;border-bottom:1px solid #cbd5e1}.top p{color:#475569}.wrap{max-width:none;margin:14px}.card{box-shadow:none}.notice{border:1px solid #bae6fd}}
  </style>
</head>
<body>
  <header class="top"><div><h1><i class="fa-solid fa-chart-column"></i> ศูนย์รายงาน</h1><p>สรุปข้อมูลตามหมวดที่ใช้งานจริง พร้อมส่งออก CSV และพิมพ์เป็น PDF</p></div><div id="user">กำลังตรวจสอบสิทธิ์…</div></header>
  <main class="wrap">
    <a class="back" href="home.html"><i class="fa-solid fa-arrow-left"></i> กลับศูนย์บัญชาการ</a>
    <div class="notice" id="notice">กำลังโหลดสรุปข้อมูล…</div>
    <section class="grid" id="cards"></section>
    <section class="tools"><button class="btn secondary" id="print"><i class="fa-solid fa-print"></i> พิมพ์รายงาน / PDF</button><button class="btn" id="exportAll"><i class="fa-solid fa-file-csv"></i> ส่งออกสรุป CSV</button></section>
    <section class="panel"><h2>รายการส่งออกตามโมดูล</h2><div class="table-wrap"><table><thead><tr><th>โมดูล</th><th>จำนวน</th><th>ส่งออก / แผนที่</th></tr></thead><tbody id="rows"></tbody></table></div></section>
  </main>
  <script>
  (()=>{
    let db,sets={}; const $=id=>document.getElementById(id);
    const csv=value=>'"'+String(value??'').replaceAll('"','""')+'"';
    const configs=[
      ['cameras','กล้อง CCTV','fa-video','cctv_locations','cctv','id,uid,camera_name,name,camera_type,ownership_category,project,area,lat,lng,status,created_at,updated_at'],
      ['economic','พื้นที่เศรษฐกิจ','fa-building-columns','economic_data','economy','id,name,type,risk_level,score,cctv'],
      ['incidents','บันทึกเหตุการณ์','fa-triangle-exclamation','incidents','security','id,case_no,incident_category,incident_subcategory,incident_type,location,status,occurred_at'],
      ['riskareas','จุดเสี่ยง / พื้นที่เฝ้าระวัง','fa-draw-polygon','risk_areas','security','id,name,area_code,risk_category,risk_level,zone_kind,status,updated_at'],
      ['riskpeople','บุคคลที่มีประวัติอาชญากรรม','fa-user-shield','risk_person_records','security','id,risk_category,first_name,last_name,latitude,longitude'],
      ['vehicles','รถแจ้งเตือน','fa-car-burst','vehicle_alerts','cctv','id,plate_number,province,vehicle_type,alert_type,status,last_location'],
      ['maintenance','แจ้งซ่อมกล้อง','fa-screwdriver-wrench','camera_maintenance_tickets','cctv','id,issue_type,priority,status,reported_at'],
      ['inspections','ตรวจสภาพกล้อง','fa-clipboard-check','camera_inspections','cctv','id,connectivity,image_quality,power_status,inspected_at'],
    ];
    function download(name,data){if(!data.length){alert('ยังไม่มีข้อมูลสำหรับส่งออก');return}const fields=Object.keys(data[0]);const text='\ufeff'+[fields.join(','),...data.map(row=>fields.map(field=>csv(row[field])).join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0)}
    function count(key){return (sets[key]||[]).length.toLocaleString('th-TH')}
    function mapLink(view){
      const links={
        cctv:'camera-center.html#camera-locations-map', economy:'critical-infrastructure.html',
        security:'investigations.html', risk:'risk-areas.html', people:'risk-persons.html',
        vehicle:'vehicle-alerts.html', alerts:'home.html'
      };
      return links[view]||'home.html';
    }
    function draw(){
      const total=configs.reduce((sum,[key])=>sum+(sets[key]||[]).length,0);
      const openLink=view=>`<a class="btn map" href="${mapLink(view)}"><i class="fa-solid fa-map"></i> แผนที่</a>`;
      $('cards').innerHTML=configs.map(([key,label,icon])=>`<article class="card"><div class="icon"><i class="fa-solid ${icon}"></i></div><h2>${label}</h2><div class="count">${count(key)}</div><div class="muted">รายการในระบบ</div></article>`).join('');
      $('rows').innerHTML=configs.map(([key,label,,,view])=>`<tr><td>${label}</td><td>${count(key)}</td><td><button class="btn" data-export="${key}">CSV</button> ${openLink(view)}</td></tr>`).join('');
      document.querySelectorAll('[data-export]').forEach(button=>button.onclick=()=>download('report-'+button.dataset.export,sets[button.dataset.export]||[]));
      $('exportAll').onclick=()=>download('command-center-summary',configs.map(([key,label])=>({module:label,total:(sets[key]||[]).length,exported_at:new Date().toISOString()})));
      $('notice').textContent=`อัปเดตเมื่อ ${new Date().toLocaleString('th-TH')} · รวม ${total.toLocaleString('th-TH')} รายการ`;
    }
    async function readInQueue(table,columns,max=5000){
      const all=[];
      for(let from=0;from<max;from+=500){
        const {data,error}=await db.from(table).select(columns).order('id',{ascending:true}).range(from,Math.min(from+499,max-1));
        if(error)throw error;
        all.push(...(data||[]));
        if(!data||data.length<500)break;
        await new Promise(resolve=>setTimeout(resolve,25));
      }
      return all;
    }
    async function load(){
      sets={};$('notice').className='notice';const failed=[];
      for(let index=0;index<configs.length;index++){
        const row=configs[index],key=row[0],label=row[1],table=row[3],columns=row[5];
        $('notice').textContent=`กำลังโหลด ${label} (${index+1}/${configs.length})…`;
        try{sets[key]=await readInQueue(table,columns)}catch(error){console.warn('Report module skipped:',key,error);sets[key]=[];failed.push(label)}
      }
      draw();
      if(failed.length){$('notice').textContent='สรุปข้อมูลส่วนที่อ่านได้แล้ว · ยังโหลดไม่ได้: '+failed.join(', ');$('notice').className='notice error'}
    }
    function start(event){const session=event?.detail||window.cctvSession;if(!session?.client)return;if(!['ADMIN','OFFICER','VIEWER'].includes(session.profile?.role)){alert('บัญชีนี้ไม่มีสิทธิ์เข้าถึงศูนย์รายงาน');location.replace('home.html');return}db=session.client;$('user').textContent=`${session.profile.full_name||session.user.email} · ${session.profile.role}`;$('print').onclick=()=>window.print();load()}
    window.addEventListener('cctv-auth-ready',start,{once:true});if(window.cctvSession)start();
  })();
  </script>
</body>
</html>

<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ข้อมูลกล้องและจุดติดตั้ง</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-guard.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5fbff;color:#19364a;font-family:'Noto Sans Thai',sans-serif}.head{padding:15px 20px;background:#fff;border-bottom:1px solid #d4e8f3}.head h2{font-size:18px;margin:0}.head p{font-size:13px;margin:3px 0 0;color:#5c7180}.layout{display:grid;grid-template-columns:325px 1fr;min-height:calc(100vh - 82px)}.side{padding:16px;background:#fff;border-right:1px solid #d4e8f3;overflow:auto}.side label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}.side input,.side select{width:100%;font:inherit;padding:9px;border:1px solid #c9dde9;border-radius:8px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.stats div{border-radius:8px;background:#e9f6ff;padding:9px;font-size:12px}.stats b{display:block;color:#056a9f;font-size:18px;margin-top:2px}.owner-summary{margin-top:10px;border:1px solid #d6e7f3;border-radius:8px;overflow:hidden}.owner-summary h3{margin:0;padding:8px 9px;background:#eff8ff;font-size:12px}.owner-summary button{display:flex;width:100%;justify-content:space-between;gap:8px;padding:6px 9px;border:0;border-top:1px solid #e4eff6;background:#fff;color:#19364a;font:inherit;font-size:12px;text-align:left;cursor:pointer}.owner-summary button:hover{background:#edf7ff}.owner-summary b{color:#056a9f}.export{width:100%;margin-top:10px;border:0;border-radius:8px;padding:9px;background:#16785d;color:#fff;font:700 13px 'Noto Sans Thai',sans-serif;cursor:pointer}.print{width:100%;margin-top:8px;border:1px solid #1d4ed8;border-radius:8px;padding:9px;background:#fff;color:#1d4ed8;font:700 13px 'Noto Sans Thai',sans-serif;cursor:pointer}.clear{width:100%;margin-top:8px;border:1px solid #9caec0;border-radius:8px;padding:8px;background:#f8fafc;color:#38516a;font:700 13px 'Noto Sans Thai',sans-serif;cursor:pointer}.notice{margin-top:14px;font-size:12px;color:#4d6472;line-height:1.45}.legend{margin-top:14px;border-top:1px solid #e1edf4;padding-top:11px}.legend h3{font-size:13px;margin:0 0 7px}.legend-row{display:flex;gap:7px;align-items:center;font-size:12px;margin:5px 0}.dot{width:12px;height:12px;border-radius:50%;display:inline-block}.mapwrap{min-width:0}.map{height:calc(100vh - 82px);min-height:600px}.camera-marker{position:relative;width:112px;height:53px;display:flex;flex-direction:column;align-items:center}.camera-pin{width:29px;height:29px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 7px #0007;font-size:13px;z-index:1}.camera-uid{display:block;max-width:112px;margin-top:2px;padding:1px 4px;border-radius:4px;background:#fff;color:#173247;border:1px solid #c7dbe8;box-shadow:0 1px 3px #0004;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:9px;font-weight:800;line-height:12px;text-align:center;word-break:break-all}.hide-camera-uids .camera-uid{display:none}.popup h3{font-size:15px;margin:0 0 8px}.popup p{font-size:12px;margin:4px 0}.popup b{color:#2563eb}.copy-uid{margin-left:5px;border:1px solid #93c5fd;border-radius:5px;background:#eff6ff;color:#1d4ed8;padding:1px 5px;font:700 10px 'Noto Sans Thai',sans-serif;cursor:pointer}.open-camera{display:inline-block;margin-top:7px;border-radius:6px;background:#1769e0;color:#fff;padding:4px 7px;text-decoration:none;font-size:11px;font-weight:700}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid #d4e8f3}.map{height:560px;min-height:560px}.side label{margin-top:8px}.camera-marker{transform:scale(.9);transform-origin:bottom center}}@media print{.side{display:none}.layout{display:block;min-height:0}.map{height:calc(100vh - 82px);min-height:0}.head{padding:8px 12px}.leaflet-control-container{display:none!important}}
  </style>
</head>
<body>
  <header class="head"><h2><i class="fa-solid fa-map-location-dot"></i> ข้อมูลกล้องและจุดติดตั้ง</h2><p>ค้นหา กรอง และเลือกหมุดเพื่อดูรายละเอียดกล้อง</p></header>
  <main class="layout">
    <aside class="side">
      <label>ค้นหากล้องหรือพื้นที่<input id="search" placeholder="ชื่อกล้อง UID หรือพื้นที่"></label>
      <label>ประเภทกล้อง<select id="type"><option value="">ทุกประเภท</option></select></label>
      <label>หน่วยงานเจ้าของกล้อง<select id="owner"><option value="">ทุกหน่วยงาน</option></select></label>
      <label>สถานะ<select id="status"><option value="">ทุกสถานะ</option></select></label><label><input id="toggleCameraUids" type="checkbox" checked> แสดง UID จริงใต้หมุดกล้อง</label>
      <div class="stats"><div>กล้องทั้งหมด<b id="total">–</b></div><div>แสดงบนแผนที่<b id="shown">–</b></div></div><section class="owner-summary" id="ownerSummary"></section><button id="zoomVisible" class="clear"><i class="fa-solid fa-expand"></i> ซูมตามหมุดที่แสดง</button><button id="clearFilters" class="clear"><i class="fa-solid fa-filter-circle-xmark"></i> ล้างตัวกรอง</button><button id="exportCsv" class="export"><i class="fa-solid fa-file-csv"></i> ส่งออก CSV ตามตัวกรอง</button><button id="printMap" class="print"><i class="fa-solid fa-print"></i> พิมพ์ / บันทึก PDF</button>
      <p class="notice" id="notice">กำลังโหลดข้อมูล…</p>
      <section class="legend" id="legend"></section>
    </aside>
    <section class="mapwrap"><div id="map" class="map"></div></section>
  </main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="marker-system.js"></script><script src="data/narathiwat-boundaries.js"></script>
  <script>
    (()=>{
      let db,items=[],categories=[],map,layer,boundaryLayer,hasFitted=false;
      const $=id=>document.getElementById(id);
      const esc=v=>String(v??'–').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
      const typeOf=x=>x.camera_categories?.name||'รอจัดประเภท';
      const iconOf=x=>{const c=x.camera_categories||{},uid=String(x.uid||'').trim();return CCTVMarkerSystem.icon('camera',{color:c.marker_color||undefined,symbol:c.marker_icon||undefined,text:uid,subtype:x.camera_type})};
async function loadAdministrativeBoundaries(){
  try{
    let geojson=window.NARATHIWAT_BOUNDARIES;
    if(!geojson){
      const response=await fetch('data/narathiwat-boundaries.geojson');
      if(!response.ok)throw new Error('boundary unavailable');
      geojson=await response.json();
    }
          boundaryLayer=L.geoJSON(geojson,{style:feature=>feature.properties.level==='amphoe'?{color:'#1459bd',weight:2,fill:false}:{color:'#38a169',weight:1,fill:false,dashArray:'3 4'},onEachFeature:(feature,featureLayer)=>featureLayer.bindTooltip(`${feature.properties.level==='amphoe'?'อำเภอ':'ตำบล'}: ${feature.properties.name}`,{sticky:true})});
          if($('toggleBoundaries')?.checked!==false)boundaryLayer.addTo(map);
        }catch(error){console.warn('Administrative boundary layer is unavailable',error)}
      }
      const setOptions=(id,values,label)=>{$(id).innerHTML=`<option value="">${label}</option>`+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')};
      function renderLegend(source=items){const rows=categories.map(c=>{const count=source.filter(x=>typeOf(x)===c.name).length;return `<div class="legend-row"><i class="dot" style="background:${esc(c.marker_color||'#64748b')}"></i><span>${esc(c.name)}</span><b style="margin-left:auto;color:#056a9f">${count.toLocaleString()}</b></div>`}).join('');$('legend').innerHTML=`<h3>สัญลักษณ์ประเภทกล้อง</h3>${rows}`}
      function popup(x){const uid=String(x.uid||'').trim();return `<div class="popup"><h3>${esc(x.camera_name||x.name||'กล้อง CCTV')}</h3><p><b>UID:</b> ${esc(uid)}${uid?`<button type="button" class="copy-uid" data-uid="${esc(uid)}">คัดลอก</button>`:''}</p><p><b>ข้อมูลรหัสผ่าน:</b> 🔒 ปกปิดบนแผนที่</p><p><b>ประเภท:</b> ${esc(typeOf(x))}</p><p><b>หน่วยงาน:</b> ${esc(x.ownership_category||'ไม่ระบุ')}</p><p><b>พื้นที่:</b> ${esc(x.area)}</p><p><b>สถานะ:</b> ${esc(x.status||'ไม่ระบุ')}</p><p><b>พิกัด:</b> ${esc(x.lat)}, ${esc(x.lng)}</p>${uid?`<a class="open-camera" href="camera-record-browser.html?search=${encodeURIComponent(uid)}">เปิดข้อมูลกล้อง</a>`:''}</div>`}
      function visibleItems(){const q=$('search').value.trim().toLowerCase(),type=$('type').value,owner=$('owner').value,status=$('status').value;return items.filter(x=>(!q||[x.camera_name,x.name,x.uid,x.area,x.ownership_category].some(v=>String(v||'').toLowerCase().includes(q)))&&(!type||typeOf(x)===type)&&(!owner||x.ownership_category===owner)&&(!status||x.status===status))}
      function render(){const hasCoordinates=x=>x.lat!==null&&x.lng!==null&&x.lat!==''&&x.lng!=='';const visible=visibleItems();layer.clearLayers();const points=[];visible.forEach(x=>{if(!hasCoordinates(x))return;const lat=Number(x.lat),lng=Number(x.lng);if(!Number.isFinite(lat)||!Number.isFinite(lng)||lat<5||lat>7.5||lng<100||lng>102.5)return;L.marker([lat,lng],{icon:iconOf(x)}).bindPopup(popup(x)).addTo(layer);points.push([lat,lng])});const owners=visible.reduce((out,x)=>{const owner=x.ownership_category||'ไม่ระบุหน่วยงาน';out[owner]=(out[owner]||0)+1;return out},{});$('ownerSummary').innerHTML='<h3>สรุปตามหน่วยงานเจ้าของ</h3>'+Object.entries(owners).sort((a,b)=>b[1]-a[1]).map(([name,count])=>`<button type="button" data-owner-summary="${esc(name)}"><span>${esc(name)}</span><b>${count.toLocaleString()} จุด</b></button>`).join('')||'<h3>สรุปตามหน่วยงานเจ้าของ</h3><div>ไม่พบข้อมูล</div>';$('ownerSummary').querySelectorAll('[data-owner-summary]').forEach(button=>button.onclick=()=>{$('owner').value=button.dataset.ownerSummary;render()});renderLegend(visible);$('total').textContent=items.length.toLocaleString();$('shown').textContent=points.length.toLocaleString();$('notice').textContent=`พบ ${visible.length.toLocaleString()} รายการ · หมุดแสดง UID จริงเฉพาะกล้องที่มีพิกัด · ข้อมูลรหัสผ่านปกปิดบนแผนที่`;if(!hasFitted&&points.length){map.fitBounds(points,{padding:[28,28],maxZoom:14});hasFitted=true}}
      function zoomVisible(){const hasCoordinates=x=>x.lat!==null&&x.lng!==null&&x.lat!==''&&x.lng!=='';const points=visibleItems().filter(x=>hasCoordinates(x)).map(x=>[Number(x.lat),Number(x.lng)]).filter(([lat,lng])=>Number.isFinite(lat)&&Number.isFinite(lng)&&lat>=5&&lat<=7.5&&lng>=100&&lng<=102.5);if(points.length)map.fitBounds(points,{padding:[28,28],maxZoom:14})}
      function exportCsv(){const rows=visibleItems().map(x=>({uid:x.uid||'',camera_name:x.camera_name||x.name||'',camera_type:typeOf(x),owner:x.ownership_category||'',area:x.area||'',status:x.status||'',latitude:x.lat??'',longitude:x.lng??''}));if(!rows.length){$('notice').textContent='ไม่มีรายการตามตัวกรองสำหรับส่งออก';return}const fields=Object.keys(rows[0]),quote=v=>'"'+String(v??'').replaceAll('"','""')+'"',content='\ufeff'+[fields.join(','),...rows.map(row=>fields.map(f=>quote(row[f])).join(','))].join('\r\n'),link=document.createElement('a');link.href=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));link.download='cctv-map-'+new Date().toISOString().slice(0,10)+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),0)}
      async function load(){
        const all=[];
        for(let from=0;;from+=500){const r=await db.from('cctv_locations').select('id,camera_name,name,uid,area,ownership_category,status,lat,lng,camera_categories(name,marker_color,marker_icon)').order('id').range(from,from+499);if(r.error){$('notice').textContent='โหลดข้อมูลไม่สำเร็จ: '+r.error.message;return}all.push(...(r.data||[]));if((r.data||[]).length<500)break;await new Promise(done=>setTimeout(done,40))}
        const c=await db.from('camera_categories').select('name,marker_color,marker_icon').eq('is_active',true).order('sort_order').order('name');if(c.error){$('notice').textContent='โหลดประเภทกล้องไม่สำเร็จ: '+c.error.message;return}
        items=all;categories=c.data||[];setOptions('type',categories.map(x=>x.name),'ทุกประเภท');setOptions('owner',[...new Set(items.map(x=>x.ownership_category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'th')),'ทุกหน่วยงาน');setOptions('status',[...new Set(items.map(x=>x.status).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'th')),'ทุกสถานะ');renderLegend();render();
      }
      function start(event){const session=event.detail||window.cctvSession;if(!session)return;db=session.client;map=L.map('map').setView([6.425,101.825],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);layer=L.layerGroup().addTo(map);const boundaryControl=document.createElement('label');boundaryControl.innerHTML='<input id="toggleBoundaries" type="checkbox" checked> ขอบเขตอำเภอ / ตำบล';$('toggleCameraUids').closest('label').after(boundaryControl);$('toggleBoundaries').onchange=event=>{if(!boundaryLayer)return;if(event.target.checked)boundaryLayer.addTo(map);else map.removeLayer(boundaryLayer)};loadAdministrativeBoundaries();document.addEventListener('click',async event=>{const button=event.target.closest('.copy-uid');if(!button)return;try{await navigator.clipboard.writeText(button.dataset.uid||'');button.textContent='คัดลอกแล้ว'}catch(error){button.textContent='คัดลอกไม่สำเร็จ'}setTimeout(()=>button.textContent='คัดลอก',1200)});$('zoomVisible').onclick=zoomVisible;$('clearFilters').onclick=()=>{['search','type','owner','status'].forEach(id=>$(id).value='');render();zoomVisible()};$('exportCsv').onclick=exportCsv;$('printMap').onclick=()=>window.print();$('toggleCameraUids').onchange=event=>$('map').classList.toggle('hide-camera-uids',!event.target.checked);['search','type','owner','status'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));load()}
      if(window.cctvSession)start({detail:window.cctvSession});else window.addEventListener('cctv-auth-ready',start,{once:true});
    })();
  </script>
<script>
(() => {
  const setupThailandMapLookup = () => {
    const input = document.getElementById('search');
    const api = window.ThailandAdmin;
    if (!input || !api) return;
    const list = document.createElement('datalist');
    list.id = 'thaiMapAreaChoices';
    document.body.appendChild(list);
    input.setAttribute('list', list.id);
    input.addEventListener('input', () => {
      const query = input.value.trim();
      list.innerHTML = query.length < 2 ? '' : api.search(query, 25).map(row => `<option value="${String(row.name).replace(/[&<>\"]/g, '')}" label="${String(row.label).replace(/[&<>\"]/g, '')}">`).join('');
    });
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setupThailandMapLookup, { once:true });
  else setupThailandMapLookup();
})();
</script>
</body>
</html>

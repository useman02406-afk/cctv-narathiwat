  <script>
    (()=>{
      let db,items=[],categories=[],map,layer,boundaryLayer,selectedAreaLayer,hasFitted=false,markerDetailsVisible=true;
      const $=id=>document.getElementById(id);
      let areaGeometry=null,areaLookupToken=0,renderToken=0,markerLabelsActive=false,fitOnNextRender=true;
      const mobileMapMode=window.matchMedia('(max-width:700px),(pointer:coarse)').matches;
      const areaGeometryCache=new Map();
      const esc=v=>String(v??'–').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
      const projectOf=x=>x.project||x.ownership_category||'ไม่ระบุโครงการ';
      /* Imported records use project + camera_type as their source of truth.
         Derive the visual category when a legacy record has no category_id. */
      const typeOf=x=>{
        const assigned=String(x.camera_categories?.name||'').trim();
        if(assigned&&assigned!=='รอระบุประเภทย่อย')return assigned;
        const text=`${projectOf(x)} ${x.camera_type||''}`.toLowerCase();
        if(text.includes('กอ.รมน')||text.includes('6เมือง')||text.includes('6 เมือง'))return 'กอ.รมน.(6เมืองหลัก)';
        if(text.includes('มหาดไทย')||text.includes('สป.มท'))return 'มหาดไทย (สป.มท)';
        if(text.includes('เอกชน')||text.includes('private'))return 'เอกชน';
        if(/ยุทธ|tactical/.test(text))return 'ยุทธวิธี';
        if(/4\s*g/.test(text))return '4G';
        if(/wi\s*-?\s*fi|wifi/.test(text))return 'WI-FI';
        return assigned||'รอระบุประเภทย่อย';
      };
      const usesDashFields=x=>['กล้อง กอ.รมน. (6เมืองหลัก)','มหาดไทย (สป.มท.)'].includes(projectOf(x));
      const markerUid=x=>usesDashFields(x)?'':String(x.uid||'').trim();
      // Keep the map readable at close zoom: the label is the camera name only.
      // UID, station and the remaining fields are available in the marker popup.
      const markerText=x=>markerDetailsVisible&&markerLabelsActive?[x.camera_name||x.name||'กล้อง CCTV']:'';
      const categoryOf=x=>categories.find(category=>category.name===typeOf(x))||x.camera_categories||{};
      const iconOf=x=>{const c=categoryOf(x),options={color:c.marker_color||'#64748b',symbol:c.marker_icon||undefined,text:markerText(x),subtype:typeOf(x)};if(window.CCTVMarkerSystem?.icon)return window.CCTVMarkerSystem.icon('camera',options);return L.divIcon({className:'cctv-unified-marker-host',html:`<span style="display:grid;place-items:center;width:34px;height:34px;border:2px solid #fff;border-radius:50% 50% 50% 0;background:${esc(c.marker_color||'#64748b')};color:#fff;font:700 16px/1 system-ui;transform:rotate(-45deg)"><b style="transform:rotate(45deg)">📹</b></span>`,iconSize:[34,38],iconAnchor:[17,34],popupAnchor:[0,-34]})};
async function loadAdministrativeBoundaries(){
  try{
    let geojson=window.NARATHIWAT_BOUNDARIES;
    if(!geojson){
      const response=await fetch('data/narathiwat-boundaries.geojson');
      if(!response.ok)throw new Error('boundary unavailable');
      geojson=await response.json();
    }
          boundaryLayer=L.geoJSON(geojson,{style:feature=>feature.properties.level==='amphoe'?{color:'#1459bd',weight:2,fill:false}:{color:'#38a169',weight:1,fill:false,dashArray:'3 4'},onEachFeature:(feature,featureLayer)=>featureLayer.bindTooltip(`${feature.properties.level==='amphoe'?'อำเภอ':'ตำบล'}: ${feature.properties.name}`,{sticky:true})});
          if($('toggleBoundaries')?.checked!==false)boundaryLayer.addTo(map);
        }catch(error){console.warn('Administrative boundary layer is unavailable',error)}
      }
      const setOptions=(id,values,label)=>{$(id).innerHTML=`<option value="">${label}</option>`+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')};
      function renderLegend(source=items){const rows=categories.map(c=>{const count=source.filter(x=>typeOf(x)===c.name).length;return `<div class="legend-row"><i class="dot" style="background:${esc(c.marker_color||'#64748b')}"></i><span>${esc(c.name)}</span><b style="margin-left:auto;color:#056a9f">${count.toLocaleString()}</b></div>`}).join('');$('legend').innerHTML=`<h3>สัญลักษณ์ประเภทกล้อง</h3>${rows}`}
      // `area` is the canonical location field in cctv_locations.
      // Do not read the legacy `station` field: it is not present in the current schema.
      const stationOf=x=>x.area||'ไม่ระบุสถานี / พื้นที่';
      const valueList=(rows,read)=>[...new Set(rows.map(read).map(value=>String(value??'').trim()).filter(Boolean))];
      const sharedValue=(rows,read)=>{const values=valueList(rows,read);return values.length===1?values[0]:values.length?values.join(' / '):'–'};
      const safeUid=x=>{const raw=String(x.uid||'').trim();return usesDashFields(x)?'-':(raw||'-')};
      const popupDetails=(rows,lat,lng)=>{
        const first=rows[0]||{};
        const type=sharedValue(rows,x=>usesDashFields(x)?'-':(x.camera_type||typeOf(x)));
        const status=sharedValue(rows,x=>x.status||'ไม่ระบุ');
        return `<dl class="popup-details"><dt>User</dt><dd class="popup-muted">🔒 ปกปิดเพื่อความปลอดภัย</dd><dt>รหัสผ่าน</dt><dd class="popup-muted">🔒 ปกปิดเพื่อความปลอดภัย</dd><dt>สภ. / พื้นที่</dt><dd>${esc(sharedValue(rows,stationOf))}</dd><dt>โครงการ</dt><dd>${esc(sharedValue(rows,projectOf))}</dd><dt>ประเภทกล้อง</dt><dd>${esc(type)}</dd><dt>พิกัดกล้อง</dt><dd>${esc(lat??first.lat)}, ${esc(lng??first.lng)}</dd><dt>สถานะ</dt><dd>${esc(status)}</dd></dl>`;
      };
      function popup(x){const rawUid=String(x.uid||'').trim(),uid=safeUid(x),name=x.camera_name||x.name||'กล้อง CCTV';return `<div class="popup"><h3><span>ชื่อกล้อง</span>${esc(name)}</h3><p class="popup-count"><b>จำนวนกล้อง</b> 1 ตัว</p><div class="popup-section-title">IP / UID กล้อง</div><ul class="popup-uid-list"><li><b>จุดที่ 1</b><code>${esc(uid)}</code>${rawUid&&!usesDashFields(x)?`<button type="button" class="copy-uid" data-uid="${esc(rawUid)}">คัดลอก</button>`:''}</li></ul>${popupDetails([x])}${rawUid&&!usesDashFields(x)?`<a class="open-camera" href="camera-record-browser.html?search=${encodeURIComponent(rawUid)}">เปิดข้อมูลกล้อง</a>`:''}</div>`}
      function visibleItems(){const q=$('search').value.trim().toLowerCase(),type=$('type').value,owner=$('owner').value,status=$('status').value;return items.filter(x=>(!q||[x.camera_name,x.name,x.uid,x.camera_type,x.area,stationOf(x),projectOf(x),x.ownership_category].some(v=>String(v||'').toLowerCase().includes(q)))&&(!type||typeOf(x)===type)&&(!owner||projectOf(x)===owner)&&(!status||x.status===status))}
      /* Cameras may legitimately share one physical installation point.  Group
         only their visual marker; keep every underlying record and UID. */
      const groupByCoordinate=source=>{
        const groups=new Map();
        source.forEach(x=>{
          const lat=Number(x.lat),lng=Number(x.lng);
          if(!Number.isFinite(lat)||!Number.isFinite(lng)||lat<5||lat>7.5||lng<100||lng>102.5)return;
          const key=`${lat.toFixed(7)},${lng.toFixed(7)}`;
          if(!groups.has(key))groups.set(key,{lat,lng,items:[]});
          groups.get(key).items.push(x);
        });
        return [...groups.values()];
      };
      const groupMarkerText=group=>{
        const name=group.items[0]?.camera_name||group.items[0]?.name||'กล้อง CCTV';
        return group.items.length>1?`${name} (+${group.items.length-1} กล้อง)`:name;
      };
      const groupIcon=group=>{
        const first=group.items[0];
        if(group.items.length===1)return iconOf(first);
        const category=categoryOf(first);
        const options={color:category.marker_color||'#64748b',symbol:category.marker_icon||undefined,text:markerDetailsVisible&&markerLabelsActive?groupMarkerText(group):'',subtype:typeOf(first)};
        if(window.CCTVMarkerSystem?.icon){
          const base=window.CCTVMarkerSystem.icon('camera',options);
          return L.divIcon({className:'cctv-unified-marker-host',html:`<div style="position:relative;display:inline-block">${base.options.html}<b style="position:absolute;top:-7px;right:-9px;z-index:5;min-width:20px;height:20px;padding:1px 4px;border:2px solid #fff;border-radius:999px;background:#0f172a;color:#fff;font:800 11px/16px system-ui;text-align:center;box-shadow:0 1px 4px #0008">${group.items.length}</b></div>`,iconSize:base.options.iconSize,iconAnchor:base.options.iconAnchor,popupAnchor:base.options.popupAnchor});
        }

      const popupGroup=group=>{
        if(group.items.length===1)return popup(group.items[0]);
        const names=valueList(group.items,x=>x.camera_name||x.name||'กล้อง CCTV');
        const title=names.length===1?names[0]:`${names[0]} และอีก ${names.length-1} ชื่อ`;
        const uidRows=group.items.map((x,index)=>{const rawUid=String(x.uid||'').trim(),uid=safeUid(x);return `<li><b>จุดที่ ${index+1}</b><code>${esc(uid)}</code>${rawUid&&!usesDashFields(x)?`<button type="button" class="copy-uid" data-uid="${esc(rawUid)}">คัดลอก</button>`:''}</li>`}).join('');
        return `<div class="popup popup-group"><h3><span>ชื่อกล้อง</span>${esc(title)}</h3><p class="popup-count"><b>จำนวนกล้อง</b> ${group.items.length.toLocaleString()} ตัว</p><div class="popup-section-title">IP / UID กล้อง</div><ul class="popup-uid-list">${uidRows}</ul>${popupDetails(group.items,group.lat,group.lng)}</div>`;

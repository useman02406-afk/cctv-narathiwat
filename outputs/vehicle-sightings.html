﻿<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>บันทึกการพบรถ</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-guard.js"></script><script src="smart-alert.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eff6ff;color:#172554;font-family:'Noto Sans Thai',sans-serif}.top{padding:14px clamp(18px,4vw,52px);min-height:70px;background:linear-gradient(120deg,#1d4ed8,#0ea5e9);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{font-size:19px;margin:0}.top p{font-size:13px;color:#dbeafe;margin:2px 0 0}.wrap{max-width:1280px;margin:26px auto;padding:0 18px}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}.btn,.back{border:0;border-radius:9px;padding:10px 13px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}.back{background:#fff;color:#1d4ed8}.btn{background:#2563eb;color:#fff}.btn.secondary{background:#e2e8f0;color:#1e293b}.btn.danger{background:#dc2626}.btn.small{font-size:12px;padding:6px 8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat,.panel{background:#fff;border:1px solid #bfdbfe;border-radius:13px;box-shadow:0 4px 16px #0f172a0c}.stat{padding:17px}.stat label{font-size:13px;color:#64748b}.stat b{display:block;font-size:26px;margin-top:4px}.panel{padding:20px;margin-bottom:18px}.panel h2{font-size:18px;margin:0 0 16px}.hidden{display:none!important}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.field{display:flex;gap:5px;flex-direction:column;font-size:13px;font-weight:600}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:#fff}.field textarea{min-height:65px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.notice{font-size:13px;padding:10px 12px;background:#dbeafe;color:#1e40af;border-radius:8px;margin-bottom:13px}.filters{display:flex;gap:10px;margin-bottom:15px}.filters input{font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:8px;flex:1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;background:#eff6ff;color:#64748b;font-weight:600}th,td{border-bottom:1px solid #dbeafe;padding:11px;vertical-align:top}.tag{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700}.empty{text-align:center;color:#64748b;padding:28px}@media(max-width:800px){.top{flex-direction:column;align-items:flex-start}.stats{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><header class="top"><div><h1><i class="fa-solid fa-binoculars"></i> บันทึกการพบรถ</h1><p>บันทึกการพบรถที่อยู่ในรายการแจ้งเตือน แยกเป็นแต่ละเหตุการณ์</p></div><div id="user">กำลังตรวจสอบสิทธิ์…</div></header><main class="wrap"><div class="bar"><a class="back" href="vehicle-alerts.html"><i class="fa-solid fa-arrow-left"></i> กลับรถแจ้งเตือน</a><button class="btn" id="new"><i class="fa-solid fa-plus"></i> บันทึกการพบรถ</button></div><section class="stats"><div class="stat"><label>บันทึกทั้งหมด</label><b id="all">–</b></div><div class="stat"><label>พบวันนี้</label><b id="today">–</b></div><div class="stat"><label>จากกล้อง CCTV</label><b id="cctv">–</b></div></section><section class="panel hidden" id="formPanel"><h2 id="formTitle">บันทึกการพบรถ</h2><div class="form"><label class="field full">รถแจ้งเตือน *<select id="vehicle"></select></label><label class="field">วันและเวลาที่พบ *<input type="datetime-local" id="seenAt"></label><label class="field">แหล่งข้อมูล<select id="source"><option>เจ้าหน้าที่</option><option>กล้อง CCTV</option><option>ประชาชนแจ้ง</option><option>หน่วยร่วม</option></select></label><label class="field">สถานที่ *<input id="location" placeholder="ระบุสถานที่พบ"></label><label class="field">ละติจูด<input type="number" step="any" id="lat"></label><label class="field">ลองจิจูด<input type="number" step="any" id="lng"></label><label class="field full">รายละเอียดที่พบ<textarea id="observation" placeholder="เช่น ทิศทางที่มุ่งหน้า ลักษณะผู้ขับ หรือรายละเอียดการตรวจพบ"></textarea></label><label class="field full">การดำเนินการ<textarea id="action" placeholder="เช่น แจ้งสายตรวจ ประสานหน่วยงาน หรือติดตามต่อ"></textarea></label></div><div class="actions"><button class="btn secondary" id="cancel">ยกเลิก</button><button class="btn" id="save"><i class="fa-solid fa-floppy-disk"></i> บันทึก</button></div></section><section class="panel"><h2>ประวัติการตรวจพบ</h2><div id="notice" class="notice">กำลังโหลดข้อมูล…</div><div class="filters"><input id="search" placeholder="ค้นหาทะเบียน สถานที่ หรือรายละเอียด"></div><div class="tablewrap"><table><thead><tr><th>รถแจ้งเตือน</th><th>วันเวลา / แหล่งข้อมูล</th><th>สถานที่</th><th>รายละเอียด</th><th>จัดการ</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>(()=>{let db,session,items=[],vehicles=[],editId=null;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const dt=v=>v?new Date(v).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}):'–';const localInput=v=>v?new Date(new Date(v).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):'';const canEdit=()=>['ADMIN','OFFICER','VIEWER'].includes(session.profile.role);function drawOptions(){const old=$('vehicle').value;$('vehicle').innerHTML='<option value="">เลือกรถแจ้งเตือน</option>'+vehicles.map(v=>`<option value="${v.id}">${esc(v.plate_number)}${v.province?' · '+esc(v.province):''} — ${esc(v.alert_type)}</option>`).join('');$('vehicle').value=old}function render(){const q=$('search').value.toLowerCase(),list=items.filter(x=>!q||[x.location,x.observation,x.vehicle_alerts?.plate_number,x.vehicle_alerts?.province].some(v=>String(v||'').toLowerCase().includes(q)));$('all').textContent=items.length;const d=new Date().toDateString();$('today').textContent=items.filter(x=>new Date(x.seen_at).toDateString()===d).length;$('cctv').textContent=items.filter(x=>x.source==='กล้อง CCTV').length;$('rows').innerHTML=list.length?list.map(x=>`<tr><td><b>${esc(x.vehicle_alerts?.plate_number||'รถที่ถูกลบ')}</b>${x.vehicle_alerts?.province?` · ${esc(x.vehicle_alerts.province)}`:''}</td><td>${dt(x.seen_at)}<br><span class="tag">${esc(x.source)}</span></td><td>${esc(x.location)}${x.latitude!=null?`<br><small>${x.latitude}, ${x.longitude}</small>`:''}</td><td>${esc(x.observation||'–')}<br><small>${esc(x.action_taken||'')}</small></td><td>${canEdit(x)?`<button class="btn small secondary" data-edit="${x.id}"><i class="fa-solid fa-pen"></i></button>${canEdit(x)?` <button class="btn small danger" data-del="${x.id}"><i class="fa-solid fa-trash"></i></button>`:''}`:'–'}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">ยังไม่มีบันทึกการพบรถ</td></tr>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>remove(b.dataset.del))}function clear(){editId=null;$('formTitle').textContent='บันทึกการพบรถ';$('vehicle').value='';$('seenAt').value=localInput(new Date().toISOString());$('source').value='เจ้าหน้าที่';['location','lat','lng','observation','action'].forEach(id=>$(id).value='')}function openEdit(id){const x=items.find(v=>v.id===id);if(!x)return;editId=id;$('formTitle').textContent='แก้ไขบันทึกการพบรถ';$('vehicle').value=x.vehicle_alert_id;$('seenAt').value=localInput(x.seen_at);$('source').value=x.source;$('location').value=x.location;$('lat').value=x.latitude??'';$('lng').value=x.longitude??'';$('observation').value=x.observation||'';$('action').value=x.action_taken||'';$('formPanel').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}async function load(){const [v,r]=await Promise.all([db.from('vehicle_alerts').select('id,plate_number,province,alert_type').eq('status','ใช้งาน').order('plate_number'),db.from('vehicle_sightings').select('*,vehicle_alerts(plate_number,province)').order('seen_at',{ascending:false})]);if(v.error||r.error){$('notice').textContent='โหลดข้อมูลไม่สำเร็จ: '+(v.error||r.error).message;return}vehicles=v.data||[];items=r.data||[];drawOptions();render();$('notice').textContent=`แสดง ${items.length} บันทึก · รถที่เลือกได้ ${vehicles.length} รายการ`}async function save(){const payload={vehicle_alert_id:$('vehicle').value,seen_at:new Date($('seenAt').value).toISOString(),source:$('source').value,location:$('location').value.trim(),latitude:$('lat').value===''?null:Number($('lat').value),longitude:$('lng').value===''?null:Number($('lng').value),observation:$('observation').value.trim()||null,action_taken:$('action').value.trim()||null,updated_at:new Date().toISOString()};if(!payload.vehicle_alert_id||!payload.location)return alert('กรุณาเลือกรถและระบุสถานที่พบ');$('save').disabled=true;const r=editId?await db.from('vehicle_sightings').update(payload).eq('id',editId):await db.from('vehicle_sightings').insert(payload);$('save').disabled=false;if(r.error)return alert('บันทึกไม่สำเร็จ: '+r.error.message);$('formPanel').classList.add('hidden');clear();load()}async function remove(id){if(!confirm('ลบบันทึกนี้หรือไม่'))return;const r=await db.from('vehicle_sightings').delete().eq('id',id);if(r.error)return alert('ลบไม่สำเร็จ: '+r.error.message);load()}function start(e){session=e.detail||window.cctvSession;if(!session)return;if(!['ADMIN','OFFICER','VIEWER'].includes(session.profile.role)){alert('บัญชีนี้ไม่มีสิทธิ์เข้าถึงบันทึกการพบรถ');location.replace('home.html');return}db=session.client;$('user').textContent=`${session.profile.full_name||session.user.email} · ${session.profile.role}`;$('new').onclick=()=>{clear();$('formPanel').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})};$('cancel').onclick=()=>{$('formPanel').classList.add('hidden');clear()};$('save').onclick=save;$('search').oninput=render;clear();load()}if(window.cctvSession)start({detail:window.cctvSession});else window.addEventListener('cctv-auth-ready',start,{once:true})})();</script></body></html>

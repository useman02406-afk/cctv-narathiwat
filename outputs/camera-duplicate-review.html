<!doctype html>
<html lang="th">
<head>
  <script>if(window.top===window.self)location.replace('camera-center.html#camera-duplicate-review.html'+location.search)</script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ตรวจสอบข้อมูลกล้องซ้ำ | CCTV POLICE9</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-guard.js"></script>
  <style>
    :root{--ink:#142333;--blue:#1e5ed8;--line:#d9e4ed;--bg:#eef4f8;--warn:#a85b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',sans-serif}.top{padding:18px clamp(18px,4vw,48px);background:#12346b;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px}.top h1{margin:0;font-size:22px}.top p{margin:3px 0 0;color:#d8e9ff;font-size:13px}.top a{color:#fff;text-decoration:none;border:1px solid #91add1;border-radius:8px;padding:8px 11px}.wrap{max-width:1340px;margin:22px auto;padding:0 18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px}.card span{font-size:13px;color:#627488}.card b{display:block;font-size:28px;margin-top:4px;color:var(--warn)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid #bfd0df;border-radius:8px;padding:8px 11px;background:#fff;color:#27435c;font:600 13px inherit;cursor:pointer}.tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}.notice{font-size:13px;color:#5c7084;margin:0 0 12px}.table{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;background:#eef5fb;color:#53687d}th,td{border-bottom:1px solid #e0e9ef;padding:11px;vertical-align:top}.key{font-weight:700;color:#183f78;word-break:break-word}.count{display:inline-block;border-radius:99px;padding:3px 8px;background:#fff1dd;color:#9a5700;font-weight:700}.item{display:block;margin-bottom:3px}.item:last-child{margin:0}.open{color:#1e5ed8;text-decoration:none;font-weight:700;white-space:nowrap}.empty{text-align:center;color:#627488;padding:28px}@media(max-width:720px){.top{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:1fr}.wrap{padding:0 10px}}
  </style>
</head>
<body>
  <header class="top"><div><h1>ตรวจสอบข้อมูลกล้องซ้ำ</h1><p>แยกกลุ่ม UID ซ้ำ ชื่อซ้ำ และพิกัดซ้ำก่อนดำเนินการแก้ไขหรือลบ</p></div><a href="camera-center.html">← ศูนย์จัดการกล้อง CCTV</a></header>
  <main class="wrap"><section class="cards"><article class="card"><span>UID ซ้ำ</span><b id="uidCount">–</b></article><article class="card"><span>ชื่อกล้องซ้ำ</span><b id="nameCount">–</b></article><article class="card"><span>พิกัดซ้ำ</span><b id="coordCount">–</b></article></section><section class="panel"><div class="tabs"><button class="active" data-kind="uid">UID ซ้ำ</button><button data-kind="name">ชื่อกล้องซ้ำ</button><button data-kind="coordinate">พิกัดซ้ำ</button></div><p id="notice" class="notice">กำลังตรวจข้อมูล…</p><div class="table"><table><thead><tr><th>ข้อมูลที่ซ้ำ</th><th>จำนวน</th><th>รายการในกลุ่ม</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
  <script>
  (()=>{
    const $=id=>document.getElementById(id), esc=v=>String(v??'–').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let db,items=[],active='uid';
    const text=v=>String(v??'').trim(), key=v=>text(v).toLocaleLowerCase('th-TH');
    const groups=(field)=>{const map=new Map();items.forEach(item=>{let value='';if(field==='uid'){value=key(item.uid);if(['','-','n/a','na','ไม่ระบุ'].includes(value))return}else if(field==='name')value=key(item.camera_name||item.name);else if(item.lat!==null&&item.lng!==null)value=Number(item.lat).toFixed(6)+', '+Number(item.lng).toFixed(6);if(!value)return;const list=map.get(value)||[];list.push(item);map.set(value,list)});return [...map.entries()].filter(([,list])=>list.length>1).sort((a,b)=>b[1].length-a[1].length)};
    function render(){const all={uid:groups('uid'),name:groups('name'),coordinate:groups('coordinate')};$('uidCount').textContent=all.uid.length.toLocaleString();$('nameCount').textContent=all.name.length.toLocaleString();$('coordCount').textContent=all.coordinate.length.toLocaleString();const current=all[active];$('notice').textContent=`พบ ${current.length.toLocaleString()} กลุ่ม — UID ที่เป็น “-” หรือไม่ระบุจะไม่ถูกนับเป็นข้อมูลซ้ำ; ตรวจสอบแต่ละกลุ่มก่อนลบ เพราะบางกล้องอาจอยู่จุดเดียวกันจริง`;$('rows').innerHTML=current.length?current.map(([value,list])=>`<tr><td class="key">${esc(value)}</td><td><span class="count">${list.length} รายการ</span></td><td>${list.map(x=>`<span class="item">#${x.id} · ${esc(x.camera_name||x.name)} · ${esc(x.area||'ไม่ระบุพื้นที่')} ${x.uid?`· UID ${esc(x.uid)}`:''}</span>`).join('')}</td><td><a class="open" href="camera-management.html?search=${encodeURIComponent(active==='uid'?value:(list[0].uid||list[0].camera_name||list[0].name||''))}">เปิดจัดการ →</a></td></tr>`).join(''):'<tr><td colspan="4" class="empty">ไม่พบข้อมูลซ้ำในหมวดนี้</td></tr>';}
    async function load(){const rows=[];for(let from=0;;from+=500){const r=await db.from('cctv_locations').select('id,camera_name,name,uid,area,lat,lng').order('id').range(from,from+499);if(r.error)throw r.error;rows.push(...(r.data||[]));if((r.data||[]).length<500)break}items=rows;render()}
    function start(event){const session=event.detail||window.cctvSession;if(!session)return;if(session.profile?.role!=='ADMIN'){document.body.innerHTML='<main class="wrap"><section class="panel"><h1>ไม่มีสิทธิ์เข้าถึง</h1><p>หน้านี้สำหรับ ADMIN เพื่อทบทวนข้อมูลซ้ำก่อนดำเนินการเท่านั้น</p></section></main>';return}db=session.client;document.querySelectorAll('[data-kind]').forEach(button=>button.onclick=()=>{active=button.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===button));render()});load().catch(error=>$('notice').textContent='ตรวจข้อมูลไม่สำเร็จ: '+error.message)}
    if(window.cctvSession)start({detail:window.cctvSession});else window.addEventListener('cctv-auth-ready',start,{once:true});
  })();
  </script>
</body></html>

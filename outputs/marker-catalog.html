<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>location.replace('camera-categories.html#system-markers');</script>
  <title>จัดการหมุดทุกโมดูล</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-guard.js?v=4"></script><script src="smart-alert.js"></script>
  <style>*{box-sizing:border-box}body{margin:0;background:#eff6ff;color:#172033;font-family:'Noto Sans Thai',sans-serif}.top{padding:15px clamp(18px,4vw,52px);background:linear-gradient(120deg,#4338ca,#0891b2);color:#fff;display:flex;justify-content:space-between;gap:12px;align-items:center}.top h1{font-size:20px;margin:0}.top p{margin:3px 0 0;font-size:13px;color:#dbeafe}.wrap{max-width:1200px;margin:24px auto;padding:0 18px}.bar,.actions{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}.btn{border:0;border-radius:9px;padding:10px 13px;background:#2563eb;color:#fff;font:700 14px inherit;cursor:pointer;text-decoration:none}.btn.muted{background:#fff;color:#1d4ed8}.btn.danger{background:#dc2626}.btn.small{font-size:12px;padding:6px 8px}.panel{background:#fff;border:1px solid #bfdbfe;border-radius:14px;padding:18px;box-shadow:0 4px 16px #0f172a0c;margin-bottom:16px}.notice{padding:10px 12px;border-radius:8px;background:#e0f2fe;color:#075985;font-size:13px}.form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700}.field input,.field select{font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:8px}.preview{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px #0f172a44}.preview span{transform:rotate(45deg)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left}th{background:#f8fafc;color:#64748b}.hidden{display:none!important}.empty{text-align:center;padding:28px;color:#64748b}@media(max-width:760px){.top,.bar{align-items:flex-start;flex-direction:column}.form{grid-template-columns:1fr 1fr}.wrap{padding:0 12px}}</style>
</head>
<body>
  <header class="top"><div><h1><i class="fa-solid fa-map-pin"></i> จัดการหมุดทุกโมดูล</h1><p>สี สัญลักษณ์ และชื่อหมุดมาตรฐาน ใช้ร่วมกันบนแผนที่ทุกหน้า</p></div><div id="user">กำลังตรวจสอบสิทธิ์…</div></header>
  <main class="wrap">
    <div class="bar"><a class="btn muted" href="camera-categories.html"><i class="fa-solid fa-arrow-left"></i> กลับจัดการหมวดหมู่กล้อง</a><button class="btn" id="new"><i class="fa-solid fa-plus"></i> เพิ่มรูปแบบหมุด</button></div>
    <section class="panel hidden" id="editor"><h2 id="title">เพิ่มรูปแบบหมุด</h2><div class="form"><label class="field">ชื่อหมุด<input id="name" placeholder="เช่น จุดรวมพล"></label><label class="field">รหัส<input id="code" placeholder="เช่น ASSEMBLY"></label><label class="field">สี<input id="color" type="color" value="#475569"></label><label class="field">ไอคอน<input id="symbol" list="markerIcons" value="●" placeholder="เลือกหรือพิมพ์ Emoji / fa-video"><datalist id="markerIcons"><option value="📹">กล้อง</option><option value="🏪">เศรษฐกิจ</option><option value="🚧">จุดตรวจ</option><option value="⚠">เหตุการณ์</option><option value="◆">พื้นที่เสี่ยง</option><option value="👤">บุคคล</option><option value="🚗">รถ</option><option value="🏠">บ้าน</option><option value="🌧">น้ำท่วม</option><option value="fa-video">Font Awesome: กล้อง</option><option value="fa-location-dot">Font Awesome: พิกัด</option><option value="fa-shield-halved">Font Awesome: ความมั่นคง</option><option value="fa-building">Font Awesome: อาคาร</option><option value="fa-car">Font Awesome: รถ</option><option value="fa-user">Font Awesome: บุคคล</option><option value="fa-triangle-exclamation">Font Awesome: แจ้งเตือน</option><option value="fa-map">Font Awesome: แผนที่</option></datalist></label><label class="field">ลำดับ<input id="order" type="number" value="100"></label></div><small>เลือกจากรายการ หรือพิมพ์ Emoji / รหัส Font Awesome เช่น <code>fa-camera</code> ได้</small><div class="actions" style="justify-content:flex-end;margin-top:13px"><button class="btn muted" id="cancel">ยกเลิก</button><button class="btn" id="save">บันทึก</button></div></section>
    <section class="panel"><div class="notice" id="notice">กำลังโหลดรูปแบบหมุด…</div><div style="overflow:auto"><table><thead><tr><th>ตัวอย่าง</th><th>ชื่อหมุด</th><th>รหัส</th><th>สี</th><th>สัญลักษณ์</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody id="rows"></tbody></table></div></section>
  </main>
  <script>(()=>{let db,session,items=[],editId=null;const $=id=>document.getElementById(id),safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const toast=(title,text,type='success')=>window.smartAlert?smartAlert(title,text,type):alert(text);const isAdmin=()=>['ADMIN','OFFICER'].includes(session?.profile?.role);function reset(){editId=null;$('title').textContent='เพิ่มรูปแบบหมุด';$('name').value='';$('code').value='';$('color').value='#475569';$('symbol').value='●';$('order').value=100}function render(){const admin=isAdmin();$('new').classList.toggle('hidden',!admin);$('rows').innerHTML=items.length?items.map(x=>`<tr><td><i class="preview" style="background:${safe(x.marker_color)}"><span>${safe(x.marker_symbol)}</span></i></td><td><b>${safe(x.name)}</b></td><td>${safe(x.code)}</td><td>${safe(x.marker_color)}</td><td>${safe(x.marker_symbol)}</td><td>${x.is_active?'ใช้งาน':'ปิดใช้'}</td><td>${admin?`<button class="btn small muted" data-edit="${x.id}">แก้ไข</button> <button class="btn small danger" data-delete="${x.id}">ลบ</button>`:'-'}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">ยังไม่มีรูปแบบหมุด</td></tr>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete))}async function load(){const r=await db.from('map_marker_categories').select('*').order('sort_order').order('name');if(r.error){$('notice').textContent='โหลดข้อมูลไม่สำเร็จ: '+r.error.message;return}items=r.data||[];render();$('notice').textContent=`พบ ${items.length} รูปแบบหมุด · การแก้ไขจะใช้กับแผนที่ทุกโมดูลเมื่อรีเฟรชข้อมูล`}function edit(id){const x=items.find(v=>v.id===id);if(!x)return;editId=id;$('title').textContent='แก้ไขรูปแบบหมุด';$('name').value=x.name;$('code').value=x.code;$('color').value=x.marker_color;$('symbol').value=x.marker_symbol;$('order').value=x.sort_order;$('editor').classList.remove('hidden')}async function save(){const p={module_key:'system',name:$('name').value.trim(),code:$('code').value.trim().toUpperCase(),marker_color:$('color').value,marker_symbol:$('symbol').value.trim(),sort_order:+$('order').value||0,updated_at:new Date().toISOString()};if(!p.name||!p.code||!p.marker_symbol)return toast('ข้อมูลไม่ครบ','กรุณาระบุชื่อ รหัส และสัญลักษณ์','warning');const r=editId?await db.from('map_marker_categories').update(p).eq('id',editId):await db.from('map_marker_categories').insert({...p,created_by:session.user.id});if(r.error)return toast('บันทึกไม่สำเร็จ',r.error.message,'error');$('editor').classList.add('hidden');reset();toast('บันทึกแล้ว','รูปแบบหมุดถูกใช้กับแผนที่ทุกโมดูล','success');load()}async function remove(id){const x=items.find(v=>v.id===id);if(!x||!confirm(`ลบรูปแบบหมุด “${x.name}” ?`))return;const r=await db.from('map_marker_categories').delete().eq('id',id);if(r.error)return toast('ลบไม่สำเร็จ',r.error.message,'error');toast('ลบแล้ว','ลบรูปแบบหมุดเรียบร้อย','success');load()}$('new').onclick=()=>{reset();$('editor').classList.remove('hidden')};$('cancel').onclick=()=>{$('editor').classList.add('hidden');reset()};$('save').onclick=save;function start(e){session=e.detail||window.cctvSession;if(!session)return;db=session.client;$('user').textContent=(session.profile.full_name||session.user.email)+' · '+session.profile.role;if(!isAdmin())$('notice').textContent='ดูข้อมูลได้ แต่ ADMIN หรือ OFFICER เท่านั้นที่แก้ไขรูปแบบหมุดได้';load()}if(window.cctvSession)start({detail:window.cctvSession});else addEventListener('cctv-auth-ready',start,{once:true})})();</script>
  <script>
  (() => {
    const lockForNonAdmin = session => {
      if (!session || session.profile?.role === 'ADMIN') return;
      const hide = () => document.querySelectorAll('#new, [data-edit], [data-delete]').forEach(node => {
        node.hidden = true;
        node.disabled = true;
        node.setAttribute('aria-hidden', 'true');
      });
      hide();
      new MutationObserver(hide).observe(document.body, { childList: true, subtree: true });
      const notice = document.getElementById('notice');
      if (notice) notice.textContent = 'ดูรูปแบบหมุดได้ แต่ ADMIN เท่านั้นที่แก้ไขได้';
    };
    if (window.cctvSession) lockForNonAdmin(window.cctvSession);
    else addEventListener('cctv-auth-ready', event => lockForNonAdmin(event.detail), { once: true });
  })();
  </script>
</body></html>

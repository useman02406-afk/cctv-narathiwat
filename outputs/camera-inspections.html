<!doctype html><html lang="th"><head><script>if(window.top===window.self)location.replace('camera-center.html#camera-inspections.html'+location.search)</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>บันทึกตรวจสภาพกล้อง</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-guard.js?v=4"></script><script src="smart-alert.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f0fdf4;color:#14532d;font-family:'Noto Sans Thai',sans-serif}.top{padding:14px clamp(18px,4vw,52px);background:linear-gradient(120deg,#15803d,#22c55e);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:19px;margin:0}.top p{margin:2px 0;color:#dcfce7;font-size:13px}.wrap{max-width:1320px;margin:26px auto;padding:0 18px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.btn,.back{border:0;border-radius:9px;padding:10px 13px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}.back{background:#fff;color:#15803d}.btn{background:#16a34a;color:#fff}.btn.secondary{background:#e2e8f0;color:#1e293b}.btn.danger{background:#dc2626}.btn.small{font-size:12px;padding:6px 8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat,.panel{background:#fff;border:1px solid #bbf7d0;border-radius:13px;box-shadow:0 4px 16px #0f172a0c}.stat{padding:17px}.stat label{font-size:13px;color:#64748b}.stat b{display:block;font-size:26px;margin-top:4px}.panel{padding:20px;margin-bottom:18px}.panel h2{font-size:18px;margin:0 0 16px}.hidden{display:none!important}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.field{display:flex;gap:5px;flex-direction:column;font-size:13px;font-weight:600}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:#fff}.field textarea{min-height:65px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.notice{font-size:13px;padding:10px 12px;background:#dcfce7;color:#166534;border-radius:8px;margin-bottom:13px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.filters input,.filters select{font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:8px}.filters input{flex:1;min-width:200px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;background:#f0fdf4;color:#64748b;font-weight:600}th,td{border-bottom:1px solid #dcfce7;padding:11px;vertical-align:top}.tag{display:inline-block;background:#dcfce7;color:#15803d;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700}.tag.bad{background:#fee2e2;color:#b91c1c}.empty{text-align:center;color:#64748b;padding:28px}@media(max-width:800px){.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}@media(max-width:460px){.stats{grid-template-columns:1fr}}</style></head><body><header class="top"><div><h1><i class="fa-solid fa-clipboard-check"></i> บันทึกตรวจสภาพกล้อง</h1><p>ตรวจสอบสัญญาณ คุณภาพภาพ และระบบไฟฟ้าของกล้องรายจุด</p></div><div id="user">กำลังตรวจสอบสิทธิ์…</div></header><main class="wrap"><div class="bar"><a class="back" href="camera-management.html"><i class="fa-solid fa-arrow-left"></i> กลับจัดการข้อมูลกล้อง</a><button class="btn" id="new"><i class="fa-solid fa-plus"></i> บันทึกการตรวจ</button></div><section class="stats"><div class="stat"><label>ตรวจทั้งหมด</label><b id="all">–</b></div><div class="stat"><label>ออนไลน์</label><b id="online">–</b></div><div class="stat"><label>ภาพมีปัญหา</label><b id="imageBad">–</b></div><div class="stat"><label>สัญญาณ/ไฟผิดปกติ</label><b id="issue">–</b></div></section><section class="panel hidden" id="formPanel"><h2 id="formTitle">บันทึกการตรวจสภาพ</h2><div class="form"><label class="field full">จุดกล้อง *<select id="camera"></select></label><label class="field">วันและเวลาตรวจ *<input type="datetime-local" id="inspectedAt"></label><label class="field">สัญญาณ<select id="connectivity"><option>ออนไลน์</option><option>ออฟไลน์</option><option>สัญญาณไม่เสถียร</option><option>ไม่พบสัญญาณ</option></select></label><label class="field">คุณภาพภาพ<select id="quality"><option>ดี</option><option>พอใช้</option><option>ไม่ชัด</option><option>ไม่มีภาพ</option></select></label><label class="field">ระบบไฟฟ้า<select id="power"><option>ปกติ</option><option>ผิดปกติ</option><option>ไม่ทราบ</option></select></label><label class="field">ผู้ตรวจ<input id="inspector" placeholder="ชื่อผู้ตรวจ"></label><label class="field full">หมายเหตุ<textarea id="notes" placeholder="บันทึกอาการหรือข้อเสนอแนะ"></textarea></label></div><div class="actions"><button class="btn secondary" id="cancel">ยกเลิก</button><button class="btn" id="save"><i class="fa-solid fa-floppy-disk"></i> บันทึก</button></div></section><section class="panel"><h2>ประวัติการตรวจสภาพ</h2><div id="notice" class="notice">กำลังโหลดข้อมูล…</div><div class="filters"><input id="search" placeholder="ค้นหาชื่อกล้อง รหัสกล้อง หรือพื้นที่"><select id="filter"><option value="">ทุกสัญญาณ</option><option>ออนไลน์</option><option>ออฟไลน์</option><option>สัญญาณไม่เสถียร</option><option>ไม่พบสัญญาณ</option></select></div><div class="tablewrap"><table><thead><tr><th>กล้อง</th><th>วันตรวจ</th><th>สัญญาณ</th><th>ภาพ</th><th>ไฟฟ้า</th><th>ผู้ตรวจ</th><th>จัดการ</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>(()=>{let db,session,items=[],cameras=[],editId=null;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const dt=v=>v?new Date(v).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}):'–';const local=v=>v?new Date(new Date(v).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):'';const canEdit=()=>['ADMIN','OFFICER'].includes(session.profile.role);function label(c){return [c.uid,c.camera_name||c.name,c.area].filter(Boolean).join(' · ')||`กล้อง #${c.id}`}function options(){const old=$('camera').value;$('camera').innerHTML='<option value="">เลือกจุดกล้อง</option>'+cameras.map(c=>`<option value="${c.id}">${esc(label(c))}</option>`).join('');$('camera').value=old}function bad(x){return x.connectivity!=='ออนไลน์'||x.image_quality==='ไม่ชัด'||x.image_quality==='ไม่มีภาพ'||x.power_status==='ผิดปกติ'}function render(){const q=$('search').value.toLowerCase(),f=$('filter').value,list=items.filter(x=>(!q||[label(x.cctv_locations||{}),x.inspector_name,x.notes].some(v=>String(v||'').toLowerCase().includes(q)))&&(!f||x.connectivity===f));$('all').textContent=items.length;$('online').textContent=items.filter(x=>x.connectivity==='ออนไลน์').length;$('imageBad').textContent=items.filter(x=>['ไม่ชัด','ไม่มีภาพ'].includes(x.image_quality)).length;$('issue').textContent=items.filter(bad).length;$('rows').innerHTML=list.length?list.map(x=>`<tr><td><b>${esc(label(x.cctv_locations||{}))}</b>${x.notes?`<br><small>${esc(x.notes)}</small>`:''}</td><td>${dt(x.inspected_at)}</td><td><span class="tag ${x.connectivity==='ออนไลน์'?'':'bad'}">${esc(x.connectivity)}</span></td><td><span class="tag ${['ไม่ชัด','ไม่มีภาพ'].includes(x.image_quality)?'bad':''}">${esc(x.image_quality)}</span></td><td><span class="tag ${x.power_status==='ผิดปกติ'?'bad':''}">${esc(x.power_status)}</span></td><td>${esc(x.inspector_name||'–')}</td><td>${canEdit(x)?`<button class="btn small secondary" data-edit="${x.id}"><i class="fa-solid fa-pen"></i></button>${canEdit(x)?` <button class="btn small danger" data-del="${x.id}"><i class="fa-solid fa-trash"></i></button>`:''}`:'–'}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">ยังไม่มีบันทึกการตรวจสภาพ</td></tr>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>remove(b.dataset.del))}function clear(){editId=null;$('formTitle').textContent='บันทึกการตรวจสภาพ';$('camera').value='';$('inspectedAt').value=local(new Date().toISOString());$('connectivity').value='ออนไลน์';$('quality').value='ดี';$('power').value='ปกติ';$('inspector').value='';$('notes').value=''}function openEdit(id){const x=items.find(v=>v.id===id);if(!x)return;editId=id;$('formTitle').textContent='แก้ไขบันทึกการตรวจ';$('camera').value=x.camera_id;$('inspectedAt').value=local(x.inspected_at);$('connectivity').value=x.connectivity;$('quality').value=x.image_quality;$('power').value=x.power_status;$('inspector').value=x.inspector_name||'';$('notes').value=x.notes||'';$('formPanel').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}async function load(){const [a,b]=await Promise.all([db.from('cctv_locations').select('id,uid,camera_name,name,area').order('id').limit(2000),db.from('camera_inspections').select('*,cctv_locations(uid,camera_name,name,area)').order('inspected_at',{ascending:false}).limit(500)]);if(a.error||b.error){$('notice').textContent='โหลดข้อมูลไม่สำเร็จ: '+(a.error||b.error).message;return}cameras=a.data||[];items=b.data||[];options();render();$('notice').textContent=`แสดง ${items.length} รายการ · จุดกล้องที่เลือกได้ ${cameras.length} จุด`}async function save(){const p={camera_id:Number($('camera').value),inspected_at:new Date($('inspectedAt').value).toISOString(),connectivity:$('connectivity').value,image_quality:$('quality').value,power_status:$('power').value,inspector_name:$('inspector').value.trim()||null,notes:$('notes').value.trim()||null,updated_at:new Date().toISOString()};if(!p.camera_id)return alert('กรุณาเลือกจุดกล้อง');$('save').disabled=true;const r=editId?await db.from('camera_inspections').update(p).eq('id',editId):await db.from('camera_inspections').insert(p);$('save').disabled=false;if(r.error)return alert('บันทึกไม่สำเร็จ: '+r.error.message);$('formPanel').classList.add('hidden');clear();load()}async function remove(id){if(!confirm('ลบบันทึกการตรวจนี้หรือไม่'))return;const r=await db.from('camera_inspections').delete().eq('id',id);if(r.error)return alert('ลบไม่สำเร็จ: '+r.error.message);load()}function start(e){
session=e.detail||window.cctvSession;if(!session)return;if(!['ADMIN','OFFICER','VIEWER'].includes(session.profile.role)){alert('บัญชีนี้ไม่มีสิทธิ์เข้าถึงบันทึกตรวจสภาพกล้อง');location.replace('home.html');return}const readOnly=session.profile.role==='VIEWER';db=session.client;$('user').textContent=`${session.profile.full_name||session.user.email} · ${session.profile.role}`;if(readOnly){$('new').hidden=true;}$('new').onclick=()=>{clear();$('formPanel').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})};$('cancel').onclick=()=>{$('formPanel').classList.add('hidden');clear()};$('save').onclick=save;['search','filter'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));clear();load()}if(window.cctvSession)start({detail:window.cctvSession});else window.addEventListener('cctv-auth-ready',start,{once:true})
async function hydrateCameraPicker(){for(let attempt=0;!db&&attempt<40;attempt++)await new Promise(resolve=>setTimeout(resolve,500));if(!db)return;try{const notice=$('notice'),rows=[],size=1000;notice.textContent='กำลังเตรียมรายชื่อกล้องครบทุกจุด…';for(let from=0;from<6000;from+=size){const r=await db.from('cctv_locations').select('id,uid,camera_name,name,area').order('id').range(from,from+size-1);if(r.error)throw r.error;rows.push(...(r.data||[]));notice.textContent=`กำลังเตรียมรายชื่อกล้อง ${rows.length.toLocaleString()} จุด…`;if((r.data||[]).length<size)break}const inspections=await db.from('camera_inspections').select('*,cctv_locations(uid,camera_name,name,area)').order('inspected_at',{ascending:false}).limit(500);if(inspections.error)throw inspections.error;cameras=rows;items=inspections.data||[];options();render();notice.textContent=`แสดง ${items.length} รายการ · จุดกล้องที่เลือกได้ ${cameras.length.toLocaleString()} จุด`}catch(error){$('notice').textContent='โหลดข้อมูลบางส่วนไม่สำเร็จ: '+(error.message||error)}}setTimeout(hydrateCameraPicker,80)
})();</script></body></html>

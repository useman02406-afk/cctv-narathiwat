﻿<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>บันทึกติดตามคดี</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-guard.js"></script><script src="smart-alert.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f0fdfa;color:#134e4a;font-family:'Noto Sans Thai',sans-serif}.top{padding:14px clamp(18px,4vw,52px);background:linear-gradient(120deg,#0f766e,#14b8a6);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:19px;margin:0}.top p{margin:2px 0;color:#ccfbf1;font-size:13px}.wrap{max-width:1280px;margin:26px auto;padding:0 18px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.btn,.back{border:0;border-radius:9px;padding:10px 13px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}.back{background:#fff;color:#0f766e}.btn{background:#0f766e;color:#fff}.btn.secondary{background:#e2e8f0;color:#1e293b}.btn.danger{background:#dc2626}.btn.small{font-size:12px;padding:6px 8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat,.panel{background:#fff;border:1px solid #99f6e4;border-radius:13px;box-shadow:0 4px 16px #0f172a0c}.stat{padding:17px}.stat label{font-size:13px;color:#64748b}.stat b{display:block;font-size:26px;margin-top:4px}.panel{padding:20px;margin-bottom:18px}.panel h2{font-size:18px;margin:0 0 16px}.hidden{display:none!important}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.field{display:flex;gap:5px;flex-direction:column;font-size:13px;font-weight:600}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:#fff}.field textarea{min-height:70px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.notice{font-size:13px;padding:10px 12px;background:#ccfbf1;color:#0f766e;border-radius:8px;margin-bottom:13px}.filters input{font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:8px;width:100%;margin-bottom:15px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;background:#f0fdfa;color:#64748b;font-weight:600}th,td{border-bottom:1px solid #ccfbf1;padding:11px;vertical-align:top}.tag{display:inline-block;background:#ccfbf1;color:#0f766e;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700}.empty{text-align:center;color:#64748b;padding:28px}@media(max-width:800px){.top{align-items:flex-start;flex-direction:column}.stats,.form{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><header class="top"><div><h1><i class="fa-solid fa-list-check"></i> บันทึกติดตามคดี</h1><p>ไทม์ไลน์การสั่งการ ผลตรวจ และการประสานงานของแต่ละเหตุ</p></div><div id="user">กำลังตรวจสอบสิทธิ์…</div></header><main class="wrap"><div class="bar"><a class="back" href="investigations.html"><i class="fa-solid fa-arrow-left"></i> กลับงานสอบสวน</a><button class="btn" id="new"><i class="fa-solid fa-plus"></i> เพิ่มบันทึก</button></div><section class="stats"><div class="stat"><label>บันทึกทั้งหมด</label><b id="all">–</b></div><div class="stat"><label>บันทึกวันนี้</label><b id="today">–</b></div><div class="stat"><label>รายการสั่งการ</label><b id="orders">–</b></div></section><section class="panel hidden" id="formPanel"><h2 id="formTitle">เพิ่มบันทึกติดตาม</h2><div class="form"><label class="field full">เลือกเหตุ / คดี *<select id="incident"></select></label><label class="field">วันและเวลา *<input type="datetime-local" id="entryAt"></label><label class="field">ประเภท<select id="entryType"><option>บันทึกติดตาม</option><option>สั่งการ</option><option>ผลตรวจ</option><option>ประสานงาน</option><option>ปิดงาน</option></select></label><label class="field">ระดับการมองเห็น<select id="visibility"><option>ภายในหน่วย</option><option>ผู้บังคับบัญชา</option></select></label><label class="field full">รายละเอียด *<textarea id="detail" placeholder="บันทึกเหตุการณ์ ผลการติดตาม หรือคำสั่งการ"></textarea></label><label class="field full">ขั้นตอนถัดไป<textarea id="nextAction" placeholder="ระบุการติดตามหรือผู้รับผิดชอบขั้นต่อไป"></textarea></label></div><div class="actions"><button class="btn secondary" id="cancel">ยกเลิก</button><button class="btn" id="save"><i class="fa-solid fa-floppy-disk"></i> บันทึก</button></div></section><section class="panel"><h2>ไทม์ไลน์การติดตาม</h2><div id="notice" class="notice">กำลังโหลดข้อมูล…</div><div class="filters"><input id="search" placeholder="ค้นหาเลขคดี ประเภทเหตุ หรือรายละเอียด"></div><div class="tablewrap"><table><thead><tr><th>เหตุ / คดี</th><th>วันเวลา</th><th>ประเภท</th><th>รายละเอียด</th><th>จัดการ</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>(()=>{let db,session,items=[],incidents=[],editId=null;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const dt=v=>v?new Date(v).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}):'–';const local=v=>v?new Date(new Date(v).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):'';const canEdit=x=>session.profile.role==='ADMIN'||x.created_by===session.user.id;function options(){const old=$('incident').value;$('incident').innerHTML='<option value="">เลือกเหตุ / คดี</option>'+incidents.map(i=>`<option value="${i.id}">${esc(i.case_no||i.incident_type)} · ${esc(i.status)}</option>`).join('');$('incident').value=old}function render(){const q=$('search').value.toLowerCase(),list=items.filter(x=>!q||[x.detail,x.next_action,x.entry_type,x.incidents?.case_no,x.incidents?.incident_type].some(v=>String(v||'').toLowerCase().includes(q)));$('all').textContent=items.length;$('today').textContent=items.filter(x=>new Date(x.entry_at).toDateString()===new Date().toDateString()).length;$('orders').textContent=items.filter(x=>x.entry_type==='สั่งการ').length;$('rows').innerHTML=list.length?list.map(x=>`<tr><td><b>${esc(x.incidents?.case_no||x.incidents?.incident_type||'เหตุที่ถูกลบ')}</b><br><small>${esc(x.incidents?.status||'')}</small></td><td>${dt(x.entry_at)}<br><small>${esc(x.visibility)}</small></td><td><span class="tag">${esc(x.entry_type)}</span></td><td>${esc(x.detail)}${x.next_action?`<br><small>ถัดไป: ${esc(x.next_action)}</small>`:''}</td><td>${canEdit(x)?`<button class="btn small secondary" data-edit="${x.id}"><i class="fa-solid fa-pen"></i></button>${session.profile.role==='ADMIN'?` <button class="btn small danger" data-del="${x.id}"><i class="fa-solid fa-trash"></i></button>`:''}`:'–'}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">ยังไม่มีบันทึกติดตาม</td></tr>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>remove(b.dataset.del))}function clear(){editId=null;$('formTitle').textContent='เพิ่มบันทึกติดตาม';$('incident').value='';$('entryAt').value=local(new Date().toISOString());$('entryType').value='บันทึกติดตาม';$('visibility').value='ภายในหน่วย';$('detail').value='';$('nextAction').value=''}function openEdit(id){const x=items.find(v=>v.id===id);if(!x)return;editId=id;$('formTitle').textContent='แก้ไขบันทึกติดตาม';$('incident').value=x.incident_id;$('entryAt').value=local(x.entry_at);$('entryType').value=x.entry_type;$('visibility').value=x.visibility;$('detail').value=x.detail;$('nextAction').value=x.next_action||'';$('formPanel').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}async function load(){const [a,b]=await Promise.all([db.from('incidents').select('id,case_no,incident_type,status').order('updated_at',{ascending:false}).limit(200),db.from('case_timeline_entries').select('*,incidents(case_no,incident_type,status)').order('entry_at',{ascending:false}).limit(300)]);if(a.error||b.error){$('notice').textContent='โหลดข้อมูลไม่สำเร็จ: '+(a.error||b.error).message;return}incidents=a.data||[];items=b.data||[];options();render();$('notice').textContent=`แสดง ${items.length} บันทึก · เหตุ/คดีที่เลือกได้ ${incidents.length} รายการ`}async function save(){const p={incident_id:$('incident').value,entry_at:new Date($('entryAt').value).toISOString(),entry_type:$('entryType').value,visibility:$('visibility').value,detail:$('detail').value.trim(),next_action:$('nextAction').value.trim()||null,updated_at:new Date().toISOString()};if(!p.incident_id||!p.detail)return alert('กรุณาเลือกเหตุ/คดี และระบุรายละเอียด');$('save').disabled=true;const r=editId?await db.from('case_timeline_entries').update(p).eq('id',editId):await db.from('case_timeline_entries').insert(p);$('save').disabled=false;if(r.error)return alert('บันทึกไม่สำเร็จ: '+r.error.message);$('formPanel').classList.add('hidden');clear();load()}async function remove(id){if(!confirm('ลบบันทึกนี้หรือไม่'))return;const r=await db.from('case_timeline_entries').delete().eq('id',id);if(r.error)return alert('ลบไม่สำเร็จ: '+r.error.message);load()}function start(e){session=e.detail||window.cctvSession;if(!session)return;if(!['ADMIN','OFFICER'].includes(session.profile.role)){alert('บัญชีนี้ไม่มีสิทธิ์เข้าถึงบันทึกติดตามคดี');location.replace('home.html');return}db=session.client;$('user').textContent=`${session.profile.full_name||session.user.email} · ${session.profile.role}`;$('new').onclick=()=>{clear();$('formPanel').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})};$('cancel').onclick=()=>{$('formPanel').classList.add('hidden');clear()};$('save').onclick=save;$('search').oninput=render;clear();load()}if(window.cctvSession)start({detail:window.cctvSession});else window.addEventListener('cctv-auth-ready',start,{once:true})})();</script></body></html>

<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>รถแจ้งเตือน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-guard.js?v=3"></script>
  <link rel="stylesheet" href="vehicle-map.css" data-vehicle-map>
  <script defer src="vehicle-map.js" data-vehicle-map="true"></script>
  <script src="smart-alert.js"></script>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#fff7ed;color:#451a03;font-family:'Noto Sans Thai',sans-serif}
    .top{padding:14px clamp(18px,4vw,52px);min-height:70px;background:linear-gradient(120deg,#9a3412,#ea580c);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{font-size:19px;margin:0}.top p{font-size:13px;color:#ffedd5;margin:2px 0 0}
    .wrap{max-width:1380px;margin:26px auto;padding:0 18px}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}.btn,.back{border:0;border-radius:9px;padding:10px 13px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}.back{background:#fff;color:#c2410c;box-shadow:0 1px 5px #0f172a1a}.btn{background:#ea580c;color:#fff}.btn.secondary{background:#e2e8f0;color:#1e293b}.btn.danger{background:#dc2626}.btn.small{font-size:12px;padding:6px 8px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat,.panel{background:#fff;border:1px solid #fed7aa;border-radius:13px;box-shadow:0 4px 16px #0f172a0c}.stat{padding:17px}.stat label{font-size:13px;color:#64748b}.stat b{display:block;font-size:26px;margin-top:4px}.panel{padding:20px;margin-bottom:18px}.panel h2{font-size:18px;margin:0 0 16px}.hidden{display:none!important}
    .form{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.field{display:flex;gap:5px;flex-direction:column;font-size:13px;font-weight:600}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:#fff}.field textarea{min-height:65px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.notice{font-size:13px;padding:10px 12px;background:#ffedd5;color:#9a3412;border-radius:8px;margin-bottom:13px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.filters input,.filters select{font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:8px}.filters input{flex:1;min-width:200px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;background:#fff7ed;color:#64748b;font-weight:600}th,td{border-bottom:1px solid #ffedd5;padding:11px;vertical-align:top}.tag{display:inline-block;background:#ffedd5;color:#c2410c;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700}.tag.found{background:#dcfce7;color:#15803d}.tag.cancel{background:#e5e7eb;color:#475569}.empty{text-align:center;color:#64748b;padding:28px}
    dialog{border:0;border-radius:15px;width:min(760px,calc(100vw - 30px));max-height:90vh;padding:0;box-shadow:0 20px 55px #0f172a66}dialog::backdrop{background:#0f172a99}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:17px 20px;background:#fff7ed}.dialog-head h2{margin:0;font-size:19px}.dialog-body{padding:20px;overflow:auto;max-height:calc(90vh - 70px)}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detail{background:#fff7ed;border-radius:10px;padding:10px}.detail label{display:block;color:#9a3412;font-size:12px;font-weight:700}.detail span{display:block;overflow-wrap:anywhere}.photos{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}.photos a{display:block;width:150px;height:105px;border-radius:9px;overflow:hidden;background:#f1f5f9}.photos img{width:100%;height:100%;object-fit:cover}
    @media(max-width:800px){.top{flex-direction:column;align-items:flex-start}.stats{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}@media(max-width:460px){.stats{grid-template-columns:1fr}.wrap{padding:0 12px}.bar{align-items:stretch;flex-direction:column}.bar>div{display:flex;gap:8px}.bar>div>*{flex:1;text-align:center}.details{grid-template-columns:1fr}.photos a{width:calc(50% - 5px);height:118px}}
  </style>
</head>
<body>
  <header class="top"><div><h1><i class="fa-solid fa-car-burst"></i> รถแจ้งเตือน</h1><p>ทะเบียนรถต้องสงสัย รถหาย และรถที่เกี่ยวข้องกับคดี</p></div><div id="user">กำลังตรวจสอบสิทธิ์…</div></header>
  <main class="wrap">
    <div class="bar"><a class="back" href="home.html"><i class="fa-solid fa-arrow-left"></i> กลับศูนย์บัญชาการ</a><div><a class="btn secondary" href="vehicle-sightings.html"><i class="fa-solid fa-binoculars"></i> บันทึกพบรถ</a> <button class="btn" id="new"><i class="fa-solid fa-plus"></i> เพิ่มรถแจ้งเตือน</button></div></div>
    <section class="stats"><div class="stat"><label>รายการทั้งหมด</label><b id="all">–</b></div><div class="stat"><label>กำลังเฝ้าระวัง</label><b id="active">–</b></div><div class="stat"><label>รถต้องสงสัย</label><b id="suspect">–</b></div><div class="stat"><label>พบแล้ว</label><b id="found">–</b></div></section>
    <section class="panel hidden" id="formPanel"><h2 id="formTitle">เพิ่มรถแจ้งเตือน</h2><div class="form"><label class="field">ทะเบียนรถ *<input id="plate" placeholder="เช่น กข 1234"></label><label class="field">จังหวัดทะเบียน<input id="province" placeholder="เช่น นราธิวาส"></label><label class="field">ประเภทรถ<select id="vehicleType"><option>รถยนต์</option><option>รถจักรยานยนต์</option><option>รถกระบะ</option><option>รถบรรทุก</option><option>รถตู้</option><option>อื่น ๆ</option></select></label><label class="field">สีรถ<input id="color" placeholder="เช่น สีขาว"></label><label class="field">ประเภทแจ้งเตือน<select id="alertType"><option>เฝ้าระวัง</option><option>รถต้องสงสัย</option><option>รถหาย</option><option>เกี่ยวข้องคดี</option></select></label><label class="field">สถานะ<select id="status"><option>ใช้งาน</option><option>พบแล้ว</option><option>ยกเลิก</option></select></label><label class="field">วันที่รับแจ้ง<input type="datetime-local" id="reportedAt"></label><label class="field">พบล่าสุดเมื่อ<input type="datetime-local" id="lastSeenAt"></label><label class="field">สถานที่พบล่าสุด<input id="lastLocation" placeholder="ระบุสถานที่"></label><label class="field">ละติจูด<input type="number" step="any" id="lat"></label><label class="field">ลองจิจูด<input type="number" step="any" id="lng"></label><label class="field full">รายละเอียด / ข้อสังเกต<textarea id="notes" placeholder="ลักษณะเด่น เหตุผลที่แจ้งเตือน หรือข้อมูลประกอบ"></textarea></label></div><div class="actions"><button class="btn secondary" id="cancel">ยกเลิก</button><button class="btn" id="save"><i class="fa-solid fa-floppy-disk"></i> บันทึก</button></div></section>
    <section class="panel"><h2>ทะเบียนรถแจ้งเตือน</h2><div id="notice" class="notice">กำลังโหลดข้อมูล…</div><div class="filters"><input id="search" placeholder="ค้นหาทะเบียน รุ่น ยี่ห้อ จังหวัด สภ. หรือสถานที่"><select id="filter"><option value="">ทุกสถานะ</option><option>ใช้งาน</option><option>พบแล้ว</option><option>ยกเลิก</option></select></div><div class="tablewrap"><table><thead><tr><th>ทะเบียน / รถ</th><th>แจ้งเตือน</th><th>สภ. / จุดพบล่าสุด</th><th>วันรับแจ้ง</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody id="rows"></tbody></table></div></section>
  </main>
  <dialog id="detailDialog"><div class="dialog-head"><h2 id="detailTitle">รายละเอียดรถแจ้งเตือน</h2><button class="btn secondary small" id="closeDetail">ปิด</button></div><div class="dialog-body"><div id="detailBody"></div></div></dialog>
  <script>
  (() => {
    let db, session, items = [], editId = null;
    const $ = id => document.getElementById(id);
    const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const dt = v => v ? new Date(v).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}) : '–';
    const val = v => v === null || v === undefined || v === '' ? '–' : esc(v);
    const canEdit = () => ['ADMIN','OFFICER'].includes(session.profile.role);
    const tagClass = x => x.status === 'พบแล้ว' ? 'found' : x.status === 'ยกเลิก' ? 'cancel' : '';
    function fields(x){return [
      ['ทะเบียนรถ',x.plate_number],['ประเภทรถ',x.vehicle_type],['ยี่ห้อ / รุ่น',[x.vehicle_brand,x.vehicle_model].filter(Boolean).join(' ')],['สี',x.vehicle_color],
      ['สถานะการเฝ้าระวัง',x.watch_status],['สถานะแจ้งเตือน',x.status],['ประเภทแจ้งเตือน',x.alert_type],['สภ.รับผิดชอบ',x.police_station],
      ['จังหวัด / ภ.จว.',x.police_province || x.province],['สถานที่พบล่าสุด',x.last_location],['พิกัด',[x.latitude,x.longitude].filter(v=>v!==null&&v!==undefined).join(', ')],['วันที่รับแจ้ง',dt(x.reported_at)],
      ['วันพบ/ได้คืน',x.recovered_at],['เลขเครื่อง',x.engine_number],['เลขตัวถัง',x.chassis_number],['สาเหตุ',x.incident_cause],['รายละเอียด',x.notes]
    ]}
    function render(){
      const q=$('search').value.toLowerCase(), f=$('filter').value;
      const list=items.filter(x=>(!q||[x.plate_number,x.province,x.vehicle_color,x.last_location,x.notes,x.vehicle_brand,x.vehicle_model,x.police_station].some(v=>String(v||'').toLowerCase().includes(q)))&&(!f||x.status===f));
      $('all').textContent=items.length;$('active').textContent=items.filter(x=>x.status==='ใช้งาน').length;$('suspect').textContent=items.filter(x=>x.alert_type==='รถต้องสงสัย').length;$('found').textContent=items.filter(x=>x.status==='พบแล้ว').length;
      $('rows').innerHTML=list.length?list.map(x=>`<tr><td><b>${esc(x.plate_number)}</b>${x.province?` · ${esc(x.province)}`:''}<br><small>${esc(x.vehicle_type)}${x.vehicle_brand?` · ${esc(x.vehicle_brand)}`:''}${x.vehicle_model?` ${esc(x.vehicle_model)}`:''}</small></td><td><span class="tag">${esc(x.alert_type)}</span>${x.photo_urls?.length?` <i class="fa-solid fa-images" title="มีรูปประกอบ"></i>`:''}<br><small>${esc(x.notes||'–')}</small></td><td>${esc(x.police_station||x.last_location||'–')}${x.last_location&&x.police_station?`<br><small>${esc(x.last_location)}</small>`:''}</td><td>${dt(x.reported_at)}</td><td><span class="tag ${tagClass(x)}">${esc(x.status)}</span></td><td><button class="btn small secondary" data-detail="${x.id}" title="ดูรายละเอียด"><i class="fa-solid fa-circle-info"></i></button>${canEdit()?` <button class="btn small secondary" data-edit="${x.id}" title="แก้ไข"><i class="fa-solid fa-pen"></i></button> <button class="btn small danger" data-del="${x.id}" title="ลบ"><i class="fa-solid fa-trash"></i></button>`:''}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">ยังไม่มีรายการรถแจ้งเตือน</td></tr>';
      document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>showDetail(b.dataset.detail));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>remove(b.dataset.del));
    }
    async function signedPhotos(x){const refs=Array.isArray(x.photo_urls)?x.photo_urls:[];const photos=[];for(const ref of refs){if(!ref?.bucket||!ref?.path)continue;const r=await db.storage.from(ref.bucket).createSignedUrl(ref.path,3600);if(!r.error&&r.data?.signedUrl)photos.push(r.data.signedUrl)}return photos}
    async function showDetail(id){const x=items.find(v=>v.id===id);if(!x)return;$('detailTitle').textContent=`รายละเอียด: ${x.plate_number||'รถแจ้งเตือน'}`;$('detailBody').innerHTML=`<div class="details">${fields(x).map(([k,v])=>`<div class="detail"><label>${esc(k)}</label><span>${val(v)}</span></div>`).join('')}</div><h3>รูปประกอบ</h3><div class="photos" id="photos"><span>กำลังโหลดรูป…</span></div>`;$('detailDialog').showModal();const photos=await signedPhotos(x);$('photos').innerHTML=photos.length?photos.map(url=>`<a href="${esc(url)}" target="_blank" rel="noopener"><img src="${esc(url)}" alt="รูปประกอบรถ ${esc(x.plate_number)}"></a>`).join(''):'<span>ไม่มีรูปประกอบ</span>'}
    function localInput(v){return v?new Date(new Date(v).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):''}
    function clear(){editId=null;$('formTitle').textContent='เพิ่มรถแจ้งเตือน';['plate','province','color','lastSeenAt','lastLocation','lat','lng','notes'].forEach(id=>$(id).value='');$('vehicleType').value='รถยนต์';$('alertType').value='เฝ้าระวัง';$('status').value='ใช้งาน';$('reportedAt').value=localInput(new Date().toISOString())}
    function openEdit(id){const x=items.find(v=>v.id===id);if(!x)return;editId=id;$('formTitle').textContent='แก้ไขรถแจ้งเตือน';$('plate').value=x.plate_number;$('province').value=x.province||'';$('vehicleType').value=x.vehicle_type||'รถยนต์';$('color').value=x.vehicle_color||'';$('alertType').value=x.alert_type||'เฝ้าระวัง';$('status').value=x.status||'ใช้งาน';$('reportedAt').value=localInput(x.reported_at);$('lastSeenAt').value=localInput(x.last_seen_at);$('lastLocation').value=x.last_location||'';$('lat').value=x.latitude??'';$('lng').value=x.longitude??'';$('notes').value=x.notes||'';$('formPanel').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}
    async function load(){const r=await db.from('vehicle_alerts').select('*').order('reported_at',{ascending:false});if(r.error){$('notice').textContent='โหลดข้อมูลไม่สำเร็จ: '+r.error.message;return}items=r.data||[];render();$('notice').textContent=`แสดง ${items.length} รายการ · รูปประกอบจะเปิดเฉพาะผู้เข้าสู่ระบบ`}
    async function save(){const payload={plate_number:$('plate').value.trim().toUpperCase(),province:$('province').value.trim()||null,vehicle_type:$('vehicleType').value,vehicle_color:$('color').value.trim()||null,alert_type:$('alertType').value,status:$('status').value,reported_at:new Date($('reportedAt').value).toISOString(),last_seen_at:$('lastSeenAt').value?new Date($('lastSeenAt').value).toISOString():null,last_location:$('lastLocation').value.trim()||null,latitude:$('lat').value===''?null:Number($('lat').value),longitude:$('lng').value===''?null:Number($('lng').value),notes:$('notes').value.trim()||null,updated_at:new Date().toISOString()};if(!payload.plate_number)return alert('กรุณาระบุทะเบียนรถ');$('save').disabled=true;const r=editId?await db.from('vehicle_alerts').update(payload).eq('id',editId):await db.from('vehicle_alerts').insert(payload);$('save').disabled=false;if(r.error)return alert('บันทึกไม่สำเร็จ: '+r.error.message);$('formPanel').classList.add('hidden');clear();load()}
    async function remove(id){if(!confirm('ลบรายการรถแจ้งเตือนนี้หรือไม่'))return;const r=await db.from('vehicle_alerts').delete().eq('id',id);if(r.error)return alert('ลบไม่สำเร็จ: '+r.error.message);load()}
    function start(e){session=e.detail||window.cctvSession;if(!session)return;if(!['ADMIN','OFFICER','VIEWER'].includes(session.profile.role)){alert('บัญชีนี้ไม่มีสิทธิ์เข้าถึงข้อมูลรถแจ้งเตือน');location.replace('home.html');return}db=session.client;$('user').textContent=`${session.profile.full_name||session.user.email} · ${session.profile.role}`;if(!canEdit())$('new').classList.add('hidden');$('new').onclick=()=>{clear();$('formPanel').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})};$('cancel').onclick=()=>{$('formPanel').classList.add('hidden');clear()};$('save').onclick=save;$('closeDetail').onclick=()=>$('detailDialog').close();['search','filter'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));clear();load()}
    if(window.cctvSession)start({detail:window.cctvSession});else window.addEventListener('cctv-auth-ready',start,{once:true});
  })();
  </script>
</body>
</html>

<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ตรวจคุณภาพข้อมูลกล้อง CCTV</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-guard.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f8fc;color:#172033;font-family:'Noto Sans Thai',sans-serif}.top{padding:16px clamp(16px,4vw,52px);background:linear-gradient(120deg,#0f766e,#2563eb);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px}.top h1{margin:0;font-size:20px}.top p{margin:3px 0 0;font-size:13px;color:#dbeafe}.back{padding:9px 12px;border-radius:8px;text-decoration:none;background:#fff;color:#1d4ed8;font-weight:700;font-size:13px}.wrap{max-width:1320px;margin:26px auto;padding:0 18px}.notice{padding:12px 14px;background:#e0f2fe;color:#075985;border-radius:10px;font-size:13px;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.card{background:#fff;border:1px solid #dbeafe;border-radius:12px;padding:15px;box-shadow:0 3px 12px #0f172a0b}.card span{display:block;font-size:12px;color:#64748b}.card b{display:block;font-size:27px;color:#1d4ed8;margin-top:4px}.card.warn b{color:#b45309}.panel{background:#fff;border:1px solid #dbeafe;border-radius:12px;padding:18px;box-shadow:0 3px 12px #0f172a0b;margin-bottom:18px}.panel h2{font-size:17px;margin:0 0 12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{font:inherit;border:1px solid #bfdbfe;background:#f8fbff;color:#1d4ed8;border-radius:8px;padding:8px 11px;cursor:pointer;font-weight:700;font-size:13px}.tab.active{background:#2563eb;color:#fff}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;text-align:left;border-bottom:1px solid #e5eef7;vertical-align:top}th{background:#f8fafc;color:#64748b;white-space:nowrap}.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:#e0e7ff;color:#3730a3;font-size:11px;font-weight:700}.link{color:#2563eb;font-weight:700;text-decoration:none;white-space:nowrap}.empty{text-align:center;color:#64748b;padding:28px}@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:1fr 1fr}.wrap{padding:0 12px}}
  </style>
</head>
<body>
  <header class="top"><div><h1><i class="fa-solid fa-shield-halved"></i> ตรวจคุณภาพข้อมูลกล้อง CCTV</h1><p>ติดตามข้อมูลที่ต้องตรวจสอบก่อนนำไปใช้ในแผนที่และรายงาน</p></div><a class="back" href="camera-management.html"><i class="fa-solid fa-arrow-left"></i> จัดการข้อมูลกล้อง</a></header>
  <main class="wrap">
    <div id="notice" class="notice">กำลังตรวจสอบข้อมูลจาก Supabase…</div>
    <section class="cards"><article class="card"><span>กล้องทั้งหมด</span><b id="all">–</b></article><article class="card warn"><span>รอระบุประเภทย่อย</span><b id="pending">–</b></article><article class="card warn"><span>สถานะไม่ระบุ</span><b id="unknownStatus">–</b></article><article class="card"><span>ข้อมูลครบถ้วน</span><b id="complete">–</b></article></section>
    <section class="panel"><h2>คิวตรวจสอบข้อมูล</h2><div class="tabs"><button class="tab active" data-tab="pending">รอระบุประเภทย่อย</button><button class="tab" data-tab="status">สถานะไม่ระบุ</button></div><div class="table-wrap"><table><thead><tr><th>ชื่อกล้อง</th><th>UID</th><th>หน่วยงานเจ้าของ</th><th>พื้นที่</th><th>สถานะ</th><th>พิกัด</th><th>ดำเนินการ</th></tr></thead><tbody id="rows"></tbody></table></div></section>
  </main>
  <script>
    (()=>{let db=[],items=[],active='pending';const $=id=>document.getElementById(id);const esc=v=>String(v??'–').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
      const ownerOf=row=>{const value=`${row.project||''} ${row.ownership_category||''} ${row.camera_type||''}`.toLowerCase();if(value.includes('มหาดไทย')||value.includes('สป.มท'))return 'กล้องมหาดไทย';if(value.includes('กอ.รมน')||value.includes('6 เมือง')||value.includes('6เมือง'))return 'กล้อง กอ.รมน. (6 เมืองหลัก)';if(value.includes('เอกชน')||value.includes('private'))return 'กล้องเอกชน';return 'กล้อง ผบช.ภ.9'};
      function render(){const pending=items.filter(x=>x.camera_categories?.name==='รอระบุประเภทย่อย'),unknown=items.filter(x=>x.status==='ไม่ระบุ');$('all').textContent=items.length.toLocaleString();$('pending').textContent=pending.length.toLocaleString();$('unknownStatus').textContent=unknown.length.toLocaleString();$('complete').textContent=(items.length-pending.length-unknown.length).toLocaleString();const rows=active==='pending'?pending:unknown;$('rows').innerHTML=rows.length?rows.map(x=>`<tr><td><b>${esc(x.camera_name||x.name)}</b></td><td>${esc(x.uid)}</td><td><span class="tag">${esc(ownerOf(x))}</span></td><td>${esc(x.area)}</td><td>${esc(x.status)}</td><td>${esc(x.lat)}, ${esc(x.lng)}</td><td><a class="link" href="camera-management.html?search=${encodeURIComponent(x.uid||x.camera_name||'')}">แก้ไขข้อมูล</a></td></tr>`).join(''):'<tr><td colspan="7" class="empty">ไม่มีรายการที่ต้องตรวจสอบ</td></tr>';}
      async function load(){const all=[];for(let from=0;;from+=500){const r=await db.from('cctv_locations').select('id,camera_name,name,uid,ownership_category,project,area,camera_type,status,lat,lng,camera_categories(name)').order('camera_name').range(from,from+499);if(r.error){$('notice').textContent='โหลดข้อมูลไม่สำเร็จ: '+r.error.message;return}all.push(...(r.data||[]));if((r.data||[]).length<500)break;}items=all;render();$('notice').textContent='ข้อมูลล่าสุดตรวจสอบเมื่อ '+new Date().toLocaleString('th-TH');}
      function start(e){const session=e.detail||window.cctvSession;if(!session)return;db=session.client;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});load();}if(window.cctvSession)start({detail:window.cctvSession});else window.addEventListener('cctv-auth-ready',start,{once:true});
    })();
  </script>
  <script>
    (()=>{
      const esc=value=>String(value??'–').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      let coordinateItems=[], coordinatePage=1;
      const perPage=50;
      const rows=document.getElementById('rows');
      const tabs=document.querySelector('.tabs');
      const cards=document.querySelector('.cards');

      function renderCoordinateQueue(){
        const totalPages=Math.max(1,Math.ceil(coordinateItems.length/perPage));
        coordinatePage=Math.min(Math.max(1,coordinatePage),totalPages);
        const start=(coordinatePage-1)*perPage;
        const pageItems=coordinateItems.slice(start,start+perPage);
        rows.innerHTML=pageItems.length?pageItems.map(item=>`<tr><td><b>${esc(item.camera_name||item.name)}</b></td><td>${esc(item.uid)}</td><td><span class="tag">${esc(item.ownership_category)}</span></td><td>${esc(item.area)}</td><td>${esc(item.status)}</td><td><span class="tag">รอเติมพิกัด</span></td><td><a class="link" href="camera-management.html?search=${encodeURIComponent(item.uid||item.camera_name||'')}">แก้ไขข้อมูล</a></td></tr>`).join(''):'<tr><td colspan="7" class="empty">ไม่มีรายการรอเติมพิกัด</td></tr>';
        let pager=document.getElementById('coordinatePager');
        if(!pager){pager=document.createElement('div');pager.id='coordinatePager';pager.style.cssText='display:flex;justify-content:flex-end;gap:8px;align-items:center;padding-top:14px;font-size:13px';document.querySelector('.table-wrap').after(pager)}
        pager.innerHTML=`<button class="tab" ${coordinatePage===1?'disabled':''} id="coordinatePrev">ก่อนหน้า</button><span>หน้า ${coordinatePage.toLocaleString()} / ${totalPages.toLocaleString()} · ${coordinateItems.length.toLocaleString()} รายการ</span><button class="tab" ${coordinatePage===totalPages?'disabled':''} id="coordinateNext">ถัดไป</button>`;
        document.getElementById('coordinatePrev')?.addEventListener('click',()=>{coordinatePage--;renderCoordinateQueue()});
        document.getElementById('coordinateNext')?.addEventListener('click',()=>{coordinatePage++;renderCoordinateQueue()});
      }

      async function setup(session){
        if(!session||document.getElementById('coordinateTab'))return;
        const result=await session.client.from('cctv_locations').select('camera_name,name,uid,ownership_category,area,camera_type,status,lat,lng').or('lat.is.null,lng.is.null').order('area').order('camera_name');
        if(result.error)return;
        coordinateItems=result.data||[];
        const count=coordinateItems.length;
        const card=document.createElement('article');
        card.className='card warn';card.style.cursor='pointer';card.title='เปิดคิวรอเติมพิกัด';
        card.innerHTML=`<span>รอเติมพิกัด</span><b>${count.toLocaleString()}</b>`;
        card.addEventListener('click',()=>document.getElementById('coordinateTab')?.click());
        cards.append(card);
        const tab=document.createElement('button');
        tab.type='button';tab.id='coordinateTab';tab.className='tab';tab.textContent=`รอเติมพิกัด (${count.toLocaleString()})`;
        tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(button=>button.classList.toggle('active',button===tab));coordinatePage=1;renderCoordinateQueue()});
        tabs.append(tab);
      }
      if(window.cctvSession)setup(window.cctvSession);else window.addEventListener('cctv-auth-ready',event=>setup(event.detail),{once:true});
    })();
  </script>
</body>
</html>

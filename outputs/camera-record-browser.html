<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ดูข้อมูลกล้อง CCTV ทั้งหมด</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-guard.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eff6ff;color:#172033;font-family:'Noto Sans Thai',sans-serif}.top{padding:15px clamp(18px,4vw,52px);background:linear-gradient(120deg,#075985,#0f766e);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{margin:0;font-size:20px}.top p{margin:3px 0 0;font-size:13px;color:#dbeafe}.back{color:#fff;border:1px solid #ffffff80;border-radius:9px;padding:9px 12px;text-decoration:none;font-weight:700;white-space:nowrap}.wrap{max-width:1600px;margin:24px auto;padding:0 18px}.panel{background:#fff;border:1px solid #bfdbfe;border-radius:14px;padding:18px;box-shadow:0 5px 20px #0f172a0d}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}.toolbar input,.toolbar select{font:inherit;border:1px solid #cbd5e1;border-radius:8px;padding:9px 10px}.toolbar input{flex:1;min-width:230px}.note{font-size:13px;color:#475569;margin-left:auto}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;min-width:990px}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}th{background:#f8fafc;color:#475569;white-space:nowrap}.tag{display:inline-block;padding:3px 8px;border-radius:999px;background:#dcfce7;color:#166534;font-size:11px}.muted{color:#64748b}.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:15px}.pages{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.pages button{font:inherit;border:1px solid #bfdbfe;background:#fff;color:#075985;border-radius:7px;min-width:34px;padding:7px 9px;cursor:pointer}.pages button.active{background:#0e7490;color:#fff;border-color:#0e7490}.pages button:disabled{opacity:.45;cursor:not-allowed}.empty{text-align:center;color:#64748b;padding:32px}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.wrap{padding:0 10px}.note{margin-left:0;width:100%}}@media print{body{background:#fff}.top{background:#fff;color:#111;padding:0 0 12px}.top p{color:#334155}.back,.toolbar,#exportPage,#printPage,.pager,th:last-child,td:last-child{display:none!important}.wrap{max-width:none;margin:0;padding:0}.panel{border:0;box-shadow:none;padding:0}.table-wrap{overflow:visible}table{min-width:0;font-size:10px}th,td{padding:5px}.tag{border:1px solid #86efac}}
  </style>
</head>
<body>
  <header class="top"><div><h1><i class="fa-solid fa-table-list"></i> ดูข้อมูลกล้อง CCTV ทั้งหมด</h1><p>ค้นหาและแบ่งหน้าตามจำนวนข้อมูลจริง เลือกแสดงได้สูงสุด 1,000 รายการต่อหน้า</p></div><a class="back" href="camera-center.html"><i class="fa-solid fa-arrow-left"></i> กลับศูนย์จัดการกล้อง</a></header>
  <main class="wrap"><section class="panel">
    <div class="toolbar"><input id="search" placeholder="ค้นหาชื่อกล้อง, UID, พื้นที่ หรือหน่วยงานเจ้าของ"><select id="owner"><option value="">ทุกหน่วยงานเจ้าของ</option></select><select id="size"><option value="25">25 รายการ/หน้า</option><option value="50" selected>50 รายการ/หน้า</option><option value="100">100 รายการ/หน้า</option><option value="200">200 รายการ/หน้า</option><option value="500">500 รายการ/หน้า</option><option value="1000">1,000 รายการ/หน้า</option></select><span class="note" id="summary">กำลังโหลดข้อมูล…</span></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin:0 0 10px"><button id="printPage" type="button" style="border:0;border-radius:8px;background:#1d4ed8;color:#fff;padding:9px 12px;font:inherit;font-weight:700;cursor:pointer"><i class="fa-solid fa-print"></i> พิมพ์ / บันทึก PDF</button><button id="exportPage" type="button" style="border:0;border-radius:8px;background:#047857;color:#fff;padding:9px 12px;font:inherit;font-weight:700;cursor:pointer"><i class="fa-solid fa-file-csv"></i> ส่งออก CSV หน้าปัจจุบัน</button></div>
    <div class="table-wrap"><table><thead><tr><th>ลำดับ</th><th>ชื่อกล้อง / UID</th><th>ประเภทกล้อง</th><th>หน่วยงานเจ้าของ</th><th>พื้นที่</th><th>พิกัด</th><th>สถานะ</th><th>เปิดจัดการ</th></tr></thead><tbody id="rows"></tbody></table></div>
    <div class="pager"><span class="muted" id="range"></span><nav class="pages" aria-label="แบ่งหน้าข้อมูล" id="pages"></nav></div>
  </section></main>
  <script>
  (()=>{
    let all=[],page=1,session;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const label=v=>v||'ไม่ระบุ';
    function render(){const q=$('search').value.trim().toLowerCase(),owner=$('owner').value,size=Number($('size').value);const list=all.filter(x=>(!owner||x.ownership_category===owner)&&(!q||[x.camera_name,x.uid,x.area,x.ownership_category,x.camera_type,x.status].some(v=>String(v||'').toLowerCase().includes(q))));const totalPages=Math.max(1,Math.ceil(list.length/size));if(page>totalPages)page=totalPages;const start=(page-1)*size,visible=list.slice(start,start+size);$('summary').textContent=`พบ ${list.length.toLocaleString()} จากทั้งหมด ${all.length.toLocaleString()} กล้อง`; $('range').textContent=list.length?`แสดง ${ (start+1).toLocaleString()}–${Math.min(start+size,list.length).toLocaleString()} จาก ${list.length.toLocaleString()} รายการ · หน้า ${page.toLocaleString()} / ${totalPages.toLocaleString()}`:'ไม่พบข้อมูล';$('rows').innerHTML=visible.length?visible.map((x,i)=>`<tr><td>${(start+i+1).toLocaleString()}</td><td><b>${esc(x.camera_name||x.name||'–')}</b><br><small>${esc(x.uid||'–')}</small></td><td>${esc(label(x.camera_type))}</td><td><span class="tag">${esc(label(x.ownership_category))}</span></td><td>${esc(label(x.area))}</td><td>${x.lat??'–'}, ${x.lng??'–'}</td><td>${esc(label(x.status))}</td><td><a href="camera-management.html?search=${encodeURIComponent(x.uid||x.camera_name||'')}">จัดการ</a></td></tr>`).join(''):'<tr><td colspan="8" class="empty">ไม่พบข้อมูลตามเงื่อนไขที่ค้นหา</td></tr>';const nums=[];const push=n=>{if(n>=1&&n<=totalPages&&!nums.includes(n))nums.push(n)};[1,2,page-1,page,page+1,totalPages-1,totalPages].forEach(push);nums.sort((a,b)=>a-b);let previous=0;$('pages').innerHTML=`<button data-page="${page-1}" ${page===1?'disabled':''} aria-label="หน้าก่อนหน้า">‹</button>`+nums.map(n=>`${n-previous>1?'<span class="muted">…</span>':''}<button data-page="${n}" class="${n===page?'active':''}">${n}</button>${previous=n,''}`).join('')+`<button data-page="${page+1}" ${page===totalPages?'disabled':''} aria-label="หน้าถัดไป">›</button>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=Number(b.dataset.page);render();window.scrollTo({top:0,behavior:'smooth'})})}
    async function load(e){session=e.detail||window.cctvSession;if(!session)return;const db=session.client,rows=[];for(let from=0;;from+=500){const r=await db.from('cctv_locations').select('id,camera_name,name,uid,camera_type,ownership_category,area,lat,lng,status').order('camera_name').range(from,from+499);if(r.error){$('summary').textContent='โหลดข้อมูลไม่สำเร็จ: '+r.error.message;return}rows.push(...(r.data||[]));if((r.data||[]).length<500)break;await new Promise(done=>setTimeout(done,40))}all=rows;const owners=[...new Set(all.map(x=>x.ownership_category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'th'));$('owner').innerHTML='<option value="">ทุกหน่วยงานเจ้าของ</option>'+owners.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');render()}
    $('search').addEventListener('input',()=>{page=1;render()});$('owner').addEventListener('change',()=>{page=1;render()});$('size').addEventListener('change',()=>{page=1;render()});if(window.cctvSession)load({detail:window.cctvSession});else window.addEventListener('cctv-auth-ready',load,{once:true});
  })();
  </script>
  <script>
    (() => {
      const escapeCsv = value => `"${String(value ?? '').replace(/"/g, '""')}"`;
      document.getElementById('printPage').addEventListener('click', () => window.print());
      document.getElementById('exportPage').addEventListener('click', () => {
        const rows = [...document.querySelectorAll('#rows tr')].filter(row => row.querySelectorAll('td').length > 1);
        if (!rows.length) return alert('ไม่มีข้อมูลในหน้าปัจจุบันให้ส่งออก');
        const header = ['ลำดับ', 'ชื่อกล้อง / UID', 'ประเภทกล้อง', 'หน่วยงานเจ้าของ', 'พื้นที่', 'พิกัด', 'สถานะ'];
        const values = rows.map(row => [...row.querySelectorAll('td')].slice(0, 7).map(cell => cell.innerText.replace(/\s+/g, ' ').trim()));
        const csv = '\ufeff' + [header, ...values].map(row => row.map(escapeCsv).join(',')).join('\r\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        const link = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `cctv-page-${new Date().toISOString().slice(0, 10)}.csv` });
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 0);
      });
    })();
  </script>
</body>
</html>

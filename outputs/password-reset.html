<html lang="th">
<head>

  <title>ตั้งรหัสผ่านใหม่ | CCTV POLICE9</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Sarabun,sans-serif;background:linear-gradient(135deg,#102f38,#195d72 52%,#4d7e8f);color:#15262b}.box{width:min(420px,calc(100vw - 34px));background:#ffffffef;border:1px solid #fff;border-radius:16px;padding:32px;box-shadow:0 22px 60px #001b29aa}h1{text-align:center;font-size:24px;margin:0 0 8px}p{color:#60737b;line-height:1.5}.field{display:block;font-size:14px;font-weight:700;margin-top:14px}.field input{width:100%;padding:11px 12px;border:1px solid #ccd8dc;border-radius:8px;font:inherit;margin-top:5px}button{width:100%;border:0;border-radius:8px;padding:12px;background:#2463df;color:#fff;font:700 16px Sarabun;cursor:pointer;margin-top:20px}.message{min-height:20px;margin:14px 0 0;font-size:14px;color:#b32432}.ok{color:#067c51}.back{display:block;text-align:center;margin-top:18px;color:#2463df;text-decoration:none;font-weight:700}
  </style>
  <link rel="stylesheet" href="jis-ui-theme.css">
</head>
<body><main class="box"><h1>ตั้งรหัสผ่านใหม่</h1><p>กำหนดรหัสผ่านใหม่อย่างน้อย 12 ตัวอักษร โดยมีตัวพิมพ์เล็ก ตัวพิมพ์ใหญ่ และตัวเลข</p><form id="form"><label class="field">รหัสผ่านใหม่<input id="password" type="password" autocomplete="new-password" required></label><label class="field">ยืนยันรหัสผ่านใหม่<input id="confirm" type="password" autocomplete="new-password" required></label><button id="save" type="submit">บันทึกรหัสผ่านใหม่</button></form><p id="message" class="message"></p><a class="back" href="login.html">กลับหน้าเข้าสู่ระบบ</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(() => {const db=supabase.createClient('https://rbahodbdbxfvftfxeipe.supabase.co','sb_publishable_s0s17pRAf8q75VOjl5TtZQ_tB1gd8b4'),$=id=>document.getElementById(id),show=(text,ok=false)=>{const x=$('message');x.textContent=text;x.className=ok?'message ok':'message'},valid=value=>value.length>=12&&/[a-z]/.test(value)&&/[A-Z]/.test(value)&&/\d/.test(value);$('form').onsubmit=async event=>{event.preventDefault();const next=$('password').value,confirm=$('confirm').value;if(next!==confirm)return show('รหัสผ่านใหม่และการยืนยันไม่ตรงกัน');if(!valid(next))return show('รหัสผ่านต้องมีอย่างน้อย 12 ตัวอักษร พร้อมตัวพิมพ์เล็ก ตัวพิมพ์ใหญ่ และตัวเลข');$('save').disabled=true;const{error}=await db.auth.updateUser({password:next});$('save').disabled=false;if(error)return show('บันทึกรหัสผ่านไม่สำเร็จ: '+error.message);show('ตั้งรหัสผ่านใหม่เรียบร้อยแล้ว กำลังกลับหน้าเข้าสู่ระบบ…',true);setTimeout(()=>location.replace('login.html'),1200)}})();
</script></body></html>

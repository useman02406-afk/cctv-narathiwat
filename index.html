<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCTV COMMAND CENTER - สภ.เมืองนราธิวาส</title>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* ป้องกันไม่ให้เลื่อนหน้าจอหลัก */
            background-color: #0b0f19; /* สีพื้นหลังกลืนกับเว็บดาร์กโหมด */
        }
        .iframe-container {
            position: absolute;
            top: -30px; /* 🟢 ทริคสำคัญ: ดันขอบจอขึ้น 30px เพื่อซ่อนแถบขาว */
            left: 0;
            width: 100%;
            height: calc(100% + 30px); /* 🟢 ขยายความสูงชดเชยส่วนที่ดันขึ้นไป */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <iframe src="https://script.google.com/macros/s/AKfycbzuczgoz7s4RJwNDoIj5Jal_UInw5QuvSl3ZcBBpF5peHE-Y0aXwdTSVgFPU_Si08Px/exec"></iframe>
    </div>

</body>
</html>
